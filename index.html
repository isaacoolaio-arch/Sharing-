<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA: Android -->
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />

  <!-- PWA: iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Oola Spares" />

  <!-- Icons: iOS needs explicit apple-touch-icon tags -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />

  <!-- iOS Splash Screens (covers common iPhone/iPad sizes) -->
  <meta name="msapplication-TileImage" content="icon-192.png" />
  <meta name="msapplication-TileColor" content="#0a0a0f" />

  <title>Oola Spares</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3a;
      --accent: #f0a500;
      --accent2: #ff6b35;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --text: #f0f0f0;
      --text2: #888;
      --text3: #555;
      --font: 'Syne', sans-serif;
      --mono: 'DM Mono', monospace;
      --radius: 12px;
      --nav-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── PIN SCREEN ── */
    #pin-screen {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 32px; padding: 24px;
    }
    .pin-logo { text-align: center; }
    .pin-logo .logo-icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 12px;
    }
    .pin-logo h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
    .pin-logo p { color: var(--text2); font-size: 13px; margin-top: 4px; }
    .pin-dots { display: flex; gap: 16px; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border);
      transition: all .2s;
    }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
    .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 240px; }
    .pin-key {
      height: 64px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font); font-size: 22px; font-weight: 700;
      cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center;
    }
    .pin-key:active { background: var(--surface2); transform: scale(.95); }
    .pin-key.del { font-size: 18px; color: var(--text2); }
    .pin-key.empty { background: transparent; border-color: transparent; cursor: default; }
    .pin-error { color: var(--red); font-size: 13px; min-height: 18px; }

    /* ── APP SHELL ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }
    #app.visible { display: flex; }

    /* ── TOP BAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px; display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-title { font-size: 18px; font-weight: 800; letter-spacing: -.5px; }
    .topbar-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .icon-btn:active { background: var(--surface2); }

    /* ── CONTENT ── */
    .content { flex: 1; padding: 16px; padding-bottom: calc(var(--nav-h) + 16px); overflow-y: auto; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-h); background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; z-index: 100;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      cursor: pointer; color: var(--text3); transition: color .2s;
      font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    }
    .nav-item .nav-icon { font-size: 20px; transition: transform .2s; }
    .nav-item.active { color: var(--accent); }
    .nav-item.active .nav-icon { transform: scale(1.1); }

    /* ── VIEWS ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── CARDS ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text2); }

    /* ── STAT GRID ── */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
    }
    .stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 800; letter-spacing: -1px; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    .stat-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

    /* ── ALERT STRIP ── */
    .alert-strip {
      background: rgba(240,165,0,.08); border: 1px solid rgba(240,165,0,.2);
      border-left: 3px solid var(--accent); border-radius: var(--radius);
      padding: 12px; margin-bottom: 12px;
    }
    .alert-strip h4 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
    .alert-item { font-size: 12px; color: var(--text2); padding: 3px 0; display: flex; justify-content: space-between; }

    /* ── LIST ITEMS ── */
    .list-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: border-color .15s;
    }
    .list-item:active { border-color: var(--accent); }
    .list-item-left { flex: 1; min-width: 0; }
    .list-item-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .list-item-right { text-align: right; flex-shrink: 0; margin-left: 12px; }
    .list-item-price { font-size: 15px; font-weight: 700; font-family: var(--mono); color: var(--accent); }
    .list-item-qty { font-size: 12px; color: var(--text2); margin-top: 2px; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    }
    .badge-low { background: rgba(239,68,68,.15); color: var(--red); }
    .badge-ok { background: rgba(34,197,94,.12); color: var(--green); }
    .badge-warn { background: rgba(240,165,0,.12); color: var(--accent); }

    /* ── FORMS ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; padding: 0;
    }
    .modal {
      background: var(--surface); border-radius: 20px 20px 0 0;
      width: 100%; max-height: 90vh; overflow-y: auto;
      padding: 20px; padding-bottom: 32px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 800; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surface2); border: none; color: var(--text);
      cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    }

    label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; color: var(--text);
      font-family: var(--font); font-size: 15px; outline: none;
      transition: border-color .2s; margin-bottom: 14px;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--surface2); }
    textarea { resize: none; min-height: 72px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn {
      width: 100%; padding: 15px; border-radius: 12px;
      font-family: var(--font); font-size: 15px; font-weight: 700;
      cursor: pointer; border: none; transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:active { opacity: .85; }
    .btn-danger { background: rgba(239,68,68,.15); color: var(--red); border: 1px solid rgba(239,68,68,.3); }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    .fab {
      position: fixed; bottom: calc(var(--nav-h) + 16px); right: 16px;
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--accent); color: #000;
      font-size: 24px; font-weight: 700;
      border: none; cursor: pointer; z-index: 50;
      box-shadow: 0 4px 20px rgba(240,165,0,.4);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s;
    }
    .fab:active { transform: scale(.93); }

    /* ── SEARCH ── */
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-wrap input {
      padding-left: 42px; margin-bottom: 0;
      font-size: 16px; height: 48px; border-radius: 14px;
      border: 1.5px solid var(--border);
      transition: border-color .2s, box-shadow .2s;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(240,165,0,.1);
    }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 18px; pointer-events:none; }
    .search-clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text3); cursor: pointer;
      font-size: 18px; padding: 4px; display: none;
    }
    .search-wrap input:not(:placeholder-shown) ~ .search-clear { display: block; }

    /* ── SECTION HEADER ── */
    .section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text3); margin: 16px 0 8px;
    }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text3); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── RATE COMPARE ── */
    .rate-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .rate-row:last-child { border-bottom: none; }
    .rate-supplier { font-size: 14px; font-weight: 600; }
    .rate-price { font-family: var(--mono); font-size: 15px; color: var(--accent); font-weight: 500; }
    .rate-best { color: var(--green); }

    /* ── CHECKLIST ── */
    .check-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
    }
    .check-box {
      width: 24px; height: 24px; border-radius: 8px;
      border: 2px solid var(--border); flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .check-box.checked { background: var(--green); border-color: var(--green); }
    .check-box.ordered { background: var(--blue); border-color: var(--blue); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 80px); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 40px; padding: 10px 20px;
      font-size: 13px; font-weight: 600; z-index: 999;
      opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error { border-color: var(--red); color: var(--red); }

    /* ── LOADER ── */
    .loader {
      display: flex; align-items: center; justify-content: center;
      padding: 40px; color: var(--text3); gap: 8px; font-size: 13px;
    }
    .spin { animation: spin 1s linear infinite; display: inline-block; font-size: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TABS ── */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
    .tab {
      padding: 7px 16px; border-radius: 20px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      border: 1px solid var(--border); color: var(--text2);
      white-space: nowrap; transition: all .15s;
    }
    .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* ── PROFIT ROW ── */
    .profit-row {
      display: flex; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .profit-row:last-child { border-bottom: none; }
    .profit-val { font-family: var(--mono); font-weight: 500; }
  </style>
</head>
<body>

<!-- OFFLINE BANNER (hidden by default) -->
<div id="offline-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:#1a1a2e;color:#f0a500;text-align:center;padding:8px;font-size:13px;font-weight:700">
  🔴 Offline — working from cached data
</div>

<!-- LOGIN SCREEN -->
<div id="pin-screen">
  <div class="pin-logo">
    <div class="logo-icon" style="overflow:hidden;padding:0">
      <img src="icon.svg" style="width:72px;height:72px;object-fit:cover" />
    </div>
    <h1>Oola Spares</h1>
    <p>Motorcycle Parts Manager</p>
  </div>

  <!-- Step 1: User select -->
  <div id="login-step-users" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:280px">
    <div style="font-size:12px;color:var(--text3);margin-bottom:4px;letter-spacing:.5px">SELECT USER</div>
    <button id="user-btn-admin" onclick="selectLoginUser('admin')" style="
      width:100%;padding:14px 20px;border-radius:14px;border:1px solid var(--border);
      background:var(--surface2);color:var(--text);font-family:var(--font);
      font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:12px;
      transition:all .2s
    ">
      <span style="font-size:22px">👑</span>
      <span id="uname-admin">Admin</span>
      <span style="margin-left:auto;font-size:11px;color:var(--accent);font-weight:700;
        background:rgba(240,165,0,.12);padding:2px 8px;border-radius:20px">ADMIN</span>
    </button>
    <button id="user-btn-user1" onclick="selectLoginUser('user1')" style="
      width:100%;padding:14px 20px;border-radius:14px;border:1px solid var(--border);
      background:var(--surface2);color:var(--text);font-family:var(--font);
      font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:12px;
      transition:all .2s
    ">
      <span style="font-size:22px">👤</span>
      <span id="uname-user1">User 1</span>
    </button>
    <button id="user-btn-user2" onclick="selectLoginUser('user2')" style="
      width:100%;padding:14px 20px;border-radius:14px;border:1px solid var(--border);
      background:var(--surface2);color:var(--text);font-family:var(--font);
      font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:12px;
      transition:all .2s
    ">
      <span style="font-size:22px">👤</span>
      <span id="uname-user2">User 2</span>
    </button>
  </div>

  <!-- Step 2: PIN entry (shown after user selected) -->
  <div id="login-step-pin" style="display:none;flex-direction:column;align-items:center;gap:0">
    <button onclick="backToUserSelect()" style="
      background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;
      margin-bottom:16px;display:flex;align-items:center;gap:6px
    ">‹ <span id="login-username-label">Admin</span></button>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-keypad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key del" onclick="pinDel()">⌫</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-actions">
      <button id="import-btn" onclick="showImportModal()" style="display:none;align-items:center;gap:4px;font-size:11px;font-weight:700;background:rgba(240,165,0,.12);color:var(--accent);border:1px solid rgba(240,165,0,.3);padding:4px 10px;border-radius:20px;cursor:pointer">⬆ Import</button>
      <button id="install-btn" onclick="installApp()" style="display:none;align-items:center;gap:4px;font-size:11px;font-weight:700;background:rgba(59,130,246,.15);color:#3b82f6;border:1px solid rgba(59,130,246,.3);padding:4px 10px;border-radius:20px;cursor:pointer">⬇ Install</button>
      <script>
        // Show Install button on iOS Safari immediately (no beforeinstallprompt on iOS)
        (function(){
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          const isStandalone = window.navigator.standalone === true;
          if (isIOS && !isStandalone) {
            document.getElementById('install-btn').style.display = 'flex';
          }
        })();
      </script>
      <span id="local-badge" style="display:none;font-size:10px;font-weight:700;background:rgba(240,165,0,.15);color:var(--accent);border:1px solid rgba(240,165,0,.3);padding:3px 8px;border-radius:20px">LOCAL</span>
      <span id="sync-status" style="display:none;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--surface2)"></span>
      <button id="sync-btn" onclick="autoSync()" style="display:none;align-items:center;gap:4px;font-size:11px;font-weight:700;background:rgba(59,130,246,.15);color:#3b82f6;border:1px solid rgba(59,130,246,.3);padding:4px 10px;border-radius:20px;cursor:pointer">🔄 Sync</button>
      <span id="online-badge" style="font-size:13px" title="Connection status">🟢</span>
      <button id="notif-btn" onclick="showInbox()" style="position:relative;background:none;border:none;font-size:20px;cursor:pointer;padding:2px 4px;display:none">
        🔔<span id="notif-badge" style="display:none;position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center">0</span>
      </button>
      <button class="icon-btn" onclick="showSettings()">⚙️</button>
      <button onclick="logoutUser()" title="Logout / Switch User" id="logout-btn" style="
        background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);
        color:var(--red);font-size:11px;font-weight:700;cursor:pointer;
        padding:4px 10px;border-radius:20px;font-family:var(--font);line-height:1.4
      ">Logout</button>
    </div>
  </div>

  <!-- CONTENT -->

<script>
// ============================================================
// CONFIG
// ============================================================
// ============================================================
// SEARCH UTILITIES — defined first so all functions can use them
// ============================================================
function smartMatch(text, query) {
  if (!query) return true;
  const t = String(text || '').toLowerCase();
  const words = query.toLowerCase().trim().split(/\s+/);
  return words.every(w => t.includes(w));
}

// highlight() defined at top of script

const API_URL = 'https://script.google.com/macros/s/AKfycbzZXGUekgfAkaQio0bQNTdQabNauWqYXxcKsxMDvfZMnL2jJRlfoj6nYIlN_hPLt-wkFQ/exec';
const CURRENCY = 'UGX';
const LOCAL_MODE = API_URL === 'YOUR_APPS_SCRIPT_URL_HERE';

// ============================================================
// OFFLINE STORAGE & SYNC SYSTEM
// Uses IndexedDB for offline data, syncs to Google Sheet when online
// ============================================================
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('OolaSpares', 2);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        // Main data stores
        ['parts','suppliers','supplierRates','sales','purchases','checklist','settings'].forEach(store => {
          if (!db.objectStoreNames.contains(store)) {
            db.createObjectStore(store, { keyPath: store === 'settings' ? 'key' : null, autoIncrement: store === 'settings' ? false : true });
          }
        });
        // Sync queue for pending offline changes
        if (!db.objectStoreNames.contains('syncQueue')) {
          db.createObjectStore('syncQueue', { autoIncrement: true });
        }
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(this.db); };
      req.onerror = e => reject(e);
    });
  },
  async getAll(store) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  },
  async setAll(store, items) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      const os = tx.objectStore(store);
      os.clear();
      items.forEach(item => os.add(item));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject();
    });
  },
  async addToQueue(action, data) {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('syncQueue', 'readwrite');
      tx.objectStore('syncQueue').add({ action, data, timestamp: Date.now() });
      tx.oncomplete = () => resolve();
    });
  },
  async getQueue() {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('syncQueue', 'readonly');
      const req = tx.objectStore('syncQueue').getAll();
      req.onsuccess = () => resolve(req.result || []);
    });
  },
  async clearQueue() {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('syncQueue', 'readwrite');
      tx.objectStore('syncQueue').clear();
      tx.oncomplete = () => resolve();
    });
  }
};

// ── ONLINE/OFFLINE DETECTION ──
let isOnline = navigator.onLine;
let syncInProgress = false;

window.addEventListener('online',  () => { isOnline = true;  updateOnlineStatus(); autoSync(); });
window.addEventListener('offline', () => { isOnline = false; updateOnlineStatus(); });

function updateOnlineStatus() {
  const badge = document.getElementById('online-badge');
  const syncBtn = document.getElementById('sync-btn');
  const banner = document.getElementById('offline-banner');

  if (badge) {
    badge.textContent = isOnline ? '🟢' : '🔴';
    badge.title = isOnline ? 'Online' : 'Offline — data cached locally';
  }
  if (syncBtn) syncBtn.style.display = isOnline ? 'flex' : 'none';
  if (banner) banner.style.display = isOnline ? 'none' : 'block';
}

// ── SMART API: tries server first, falls back to cache ──
async function smartApi(action, data = {}) {
  // Read actions — serve from cache if offline
  const readActions = ['getParts','getSuppliers','getSupplierRates','getSales',
                       'getPurchases','getChecklist','getSettings','verifyPin',
                       'getMyNotifications','verifyEditOtp','generateEditOtp',
                       'requestEditOtp','verifyEditOtp'];

  if (readActions.includes(action)) {
    if (isOnline) {
      try {
        const result = await callServer(action, data);
        // Cache fresh read data
        const storeMap = {
          getParts: 'parts', getSuppliers: 'suppliers', getSupplierRates: 'supplierRates',
          getSales: 'sales', getPurchases: 'purchases', getChecklist: 'checklist'
        };
        if (storeMap[action] && result.data) {
          await IDB.setAll(storeMap[action], result.data);
        }
        return result;
      } catch(e) {
        console.log('Server failed, using cache:', e.message);
        _maybeShowConnectionWarning(e);
      }
    }
    // Offline or server failed — serve from IndexedDB cache
    const cached = await serveFromCache(action, data);
    return cached;
  }

  // Write actions — try server
  if (isOnline) {
    try {
      const result = await callServer(action, data);
      // Always return server result (including errors) — don't silently queue on server error
      return result;
    } catch(e) {
      // Only queue on network failure (fetch threw), not on server-returned errors
      console.log('Write failed, queuing:', action, e.message);
    }
  }

  // Queue for later sync (offline only)
  await IDB.addToQueue(action, data);
  return applyLocalWrite(action, data);
}

let _connectionWarningShown = false;
function _maybeShowConnectionWarning(err) {
  if (_connectionWarningShown) return;
  _connectionWarningShown = true;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  const msg = err && err.message ? err.message : 'Unknown error';

  // Show a prominent banner instead of silently failing
  const banner = document.createElement('div');
  banner.id = 'conn-warning';
  banner.style.cssText = `
    position:fixed;bottom:80px;left:12px;right:12px;z-index:500;
    background:#1a1200;border:1px solid rgba(240,165,0,.4);border-radius:12px;
    padding:14px 16px;font-size:13px;line-height:1.7;
    box-shadow:0 4px 20px rgba(0,0,0,.6)
  `;
  banner.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div>
        <div style="font-weight:800;color:var(--accent);margin-bottom:4px">⚠️ Could not load data from server</div>
        ${isIOS && isStandalone ? `
          <div style="color:var(--text2)">
            On iPhone, make sure you have an active internet connection.<br>
            If connected, open the app in <strong>Safari</strong> first to allow network access, then return here.
          </div>
          <button onclick="window.open(location.href,'_blank')" style="margin-top:8px;background:var(--accent);
            color:#000;border:none;border-radius:8px;padding:6px 14px;font-size:12px;
            font-weight:800;cursor:pointer">Open in Safari</button>
        ` : `
          <div style="color:var(--text2)">Check your internet connection and tap Retry.</div>
        `}
      </div>
      <button onclick="document.getElementById('conn-warning').remove();_connectionWarningShown=false;"
        style="background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;
          padding:0;flex-shrink:0">✕</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="document.getElementById('conn-warning').remove();_connectionWarningShown=false;loadAll().then(()=>{renderDashboard();toast('Data loaded ✓','success');})"
        style="flex:1;background:rgba(240,165,0,.15);border:1px solid rgba(240,165,0,.3);
          color:var(--accent);border-radius:8px;padding:8px;font-size:13px;
          font-weight:800;cursor:pointer;font-family:var(--font)">↻ Retry</button>
    </div>
  `;
  document.body.appendChild(banner);
}

async function serveFromCache(action, data) {
  const storeMap = {
    getParts: 'parts', getSuppliers: 'suppliers', getSupplierRates: 'supplierRates',
    getSales: 'sales', getPurchases: 'purchases', getChecklist: 'checklist'
  };
  if (storeMap[action]) {
    const items = await IDB.getAll(storeMap[action]);
    return { success: true, data: items, fromCache: true };
  }
  if (action === 'getSettings') {
    const items = await IDB.getAll('settings');
    const map = {};
    items.forEach(i => { if(i.key) map[i.key] = i.value; });
    return { success: true, data: Object.keys(map).length ? map : { shopName:'Oola Spares', pin:'1234' } };
  }
  if (action === 'verifyPin') {
    const items = await IDB.getAll('settings');
    const pinItem = items.find(i => i.key === 'pin');
    const pin = pinItem ? String(pinItem.value) : '1234';
    return { success: String(data.pin) === pin };
  }
  return { success: false, error: 'Offline and no cache available' };
}

// Apply write operations locally to IndexedDB
async function applyLocalWrite(action, data) {
  if (action === 'savePart') {
    const parts = await IDB.getAll('parts');
    if (data.PartID) {
      const idx = parts.findIndex(p => p.PartID === data.PartID);
      if (idx >= 0) parts[idx] = { ...parts[idx], ...data };
    } else {
      data.PartID = 'PRT-' + Date.now() + '-local';
      parts.push(data);
    }
    await IDB.setAll('parts', parts);
    return { success: true, id: data.PartID };
  }
  if (action === 'deletePart') {
    const parts = await IDB.getAll('parts');
    await IDB.setAll('parts', parts.filter(p => p.PartID !== data.PartID));
    return { success: true };
  }
  if (action === 'saveSale') {
    const sales = await IDB.getAll('sales');
    data.SaleID = 'SAL-' + Date.now() + '-local';
    data.TotalAmount = (parseFloat(data.Qty)||0) * (parseFloat(data.SellingPrice)||0);
    sales.push(data);
    await IDB.setAll('sales', sales);
    // Deduct stock locally
    const parts = await IDB.getAll('parts');
    const pi = parts.findIndex(p => p.PartID === data.PartID);
    if (pi >= 0) { parts[pi].StockQty = Math.max(0, (parseInt(parts[pi].StockQty)||0) - (parseInt(data.Qty)||0)); await IDB.setAll('parts', parts); }
    return { success: true };
  }
  if (action === 'savePurchase') {
    const purchases = await IDB.getAll('purchases');
    data.PurchaseID = 'PUR-' + Date.now() + '-local';
    data.TotalCost = (parseFloat(data.Qty)||0) * (parseFloat(data.CostPrice)||0);
    purchases.push(data);
    await IDB.setAll('purchases', purchases);
    // Add stock locally
    const parts = await IDB.getAll('parts');
    const pi = parts.findIndex(p => p.PartID === data.PartID);
    if (pi >= 0) { parts[pi].StockQty = (parseInt(parts[pi].StockQty)||0) + (parseInt(data.Qty)||0); await IDB.setAll('parts', parts); }
    return { success: true };
  }
  if (action === 'saveChecklistItem') {
    const list = await IDB.getAll('checklist');
    data.ItemID = 'CHK-' + Date.now() + '-local';
    data.Status = 'Pending';
    list.push(data);
    await IDB.setAll('checklist', list);
    return { success: true };
  }
  if (action === 'updateChecklistStatus') {
    const list = await IDB.getAll('checklist');
    const i = list.findIndex(c => c.ItemID === data.ItemID);
    if (i >= 0) list[i].Status = data.Status;
    await IDB.setAll('checklist', list);
    return { success: true };
  }
  return { success: true }; // optimistic
}

async function callServer(action, data = {}) {
  if (LOCAL_MODE) return localApi(action, data);
  const params = new URLSearchParams({ action, ...data });

  // Manual timeout using AbortController (iOS 15 doesn't support AbortSignal.timeout)
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000); // 15s for slow connections

  try {
    const res = await fetch(API_URL + '?' + params, {
      method: 'GET',
      mode: 'cors',                  // explicit CORS — required for iOS standalone PWA
      credentials: 'omit',           // no cookies — avoids preflight issues
      redirect: 'follow',            // follow Apps Script redirect (script.google.com → googleusercontent.com)
      signal: controller.signal
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('Request timed out — check your internet connection');
    throw e;
  }
}

// ── AUTO SYNC ──
async function autoSync() {
  if (!isOnline || syncInProgress) return;
  const queue = await IDB.getQueue();
  if (queue.length === 0) return;

  syncInProgress = true;
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) syncBtn.style.display = 'flex';
  showSyncStatus(`Syncing ${queue.length} change${queue.length>1?'s':''}...`);

  // Filter out read-only actions that should never be in the queue
  const writeActions = ['savePart','deletePart','saveSupplier','deleteSupplier',
    'saveSale','updateSale','deleteSale','savePurchase','updatePurchase','deletePurchase',
    'saveChecklistItem','updateChecklistStatus','deleteChecklistItem',
    'saveSupplierRate','deleteSupplierRate','saveSettings',
    'sendOtpNotification','markNotificationRead','requestEditOtp'];

  const writeQueue = queue.filter(item => writeActions.includes(item.action));

  let synced = 0, failed = 0;
  for (const item of writeQueue) {
    try {
      const result = await callServer(item.action, item.data);
      // Count as synced even if duplicate (success:true with "Already exists" message)
      if (result.success !== false) synced++;
      else {
        console.log('Sync item failed:', item.action, result.error);
        failed++;
      }
    } catch(e) {
      console.log('Sync network error:', e.message);
      failed++;
    }
  }

  // ALWAYS clear the queue after attempting sync — prevents infinite re-sync loop
  await IDB.clearQueue();

  // Hide sync button since queue is now empty
  if (syncBtn) syncBtn.style.display = 'none';

  // Refresh data from server
  try {
    await loadAll();
    renderDashboard();
    if (state.currentView === 'parts') renderParts();
    if (state.currentView === 'stocklist') renderStockListContent();
    if (state.currentView === 'transactions') renderTxTab();
  } catch(e) {}

  if (failed > 0) {
    showSyncStatus(`✓ ${synced} synced${failed > 0 ? ', ' + failed + ' skipped' : ''}`, 'success');
  } else {
    showSyncStatus(`✓ Synced ${synced} changes`, 'success');
  }
  syncInProgress = false;
}

// Call this to manually clear the sync queue (emergency use)
async function clearSyncQueue() {
  await IDB.clearQueue();
  const syncBtn = document.getElementById('sync-btn');
  if (syncBtn) syncBtn.style.display = 'none';
  showSyncStatus('Queue cleared', 'success');
  toast('Sync queue cleared ✓', 'success');
}

async function testConnection() {
  closeModal();
  toast('Testing connection...', 'success');
  const start = Date.now();
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(API_URL + '?action=getSettings', {
      method: 'GET', mode: 'cors', credentials: 'omit',
      redirect: 'follow', signal: controller.signal
    });
    clearTimeout(timer);
    const ms = Date.now() - start;
    const text = await res.text();
    let parsed; try { parsed = JSON.parse(text); } catch(e) { parsed = null; }
    showModal(`
      <div class="modal-header">
        <div class="modal-title">Connection Test</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div style="font-size:13px;line-height:1.8">
        <div style="margin-bottom:10px">
          <span style="color:${res.ok ? 'var(--green)' : 'var(--red)'}">
            ${res.ok ? '✓ Server reachable' : '✗ Server error'}
          </span> · ${ms}ms · HTTP ${res.status}
        </div>
        <div style="color:var(--text2);margin-bottom:6px">Response:</div>
        <div style="background:var(--surface2);border-radius:8px;padding:10px;
          font-family:var(--mono);font-size:11px;color:var(--fg);
          word-break:break-all;max-height:160px;overflow-y:auto">
          ${text.substring(0,400)}${text.length>400?'...':''}
        </div>
        <div style="margin-top:10px;color:${parsed&&parsed.success?'var(--green)':'var(--red)'}">
          ${parsed&&parsed.success ? '✓ Valid response — tap Reload Data to fix' : '✗ Invalid response — check Apps Script deployment'}
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:16px"
        onclick="closeModal();_connectionWarningShown=false;loadAll().then(()=>{renderDashboard();toast('Reloaded ✓','success');})">
        ↻ Reload Data
      </button>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Close</button>
    `);
  } catch(e) {
    const ms = Date.now() - start;
    showModal(`
      <div class="modal-header">
        <div class="modal-title">Connection Test</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div style="font-size:13px;line-height:1.8">
        <div style="color:var(--red);margin-bottom:10px">✗ Failed after ${ms}ms</div>
        <div style="background:var(--surface2);border-radius:8px;padding:10px;
          font-family:var(--mono);font-size:12px;color:var(--red);margin-bottom:12px">
          ${e.name}: ${e.message}
        </div>
        <div style="color:var(--text2);font-size:12px;line-height:1.8">
          ${e.name==='AbortError' ? '⏱ Timed out — server took too long to respond' :
            '🚫 Network blocked — open the app URL in Safari first, then retry'}
        </div>
      </div>
      <button class="btn btn-ghost" style="margin-top:16px" onclick="closeModal()">Close</button>
    `);
  }
}

function showSyncStatus(msg, type = 'info') {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = msg;
  el.style.color = type === 'success' ? 'var(--green)' : type === 'error' ? 'var(--red)' : 'var(--accent)';
  el.style.display = 'block';
  if (type !== 'info') setTimeout(() => { if(el) el.style.display = 'none'; }, 3000);
}

function getBrands() {

    return JSON.parse(localStorage.getItem('os_brands')) ||
      ['CC','Titan','RZ','Kevla','MRF','Crocodile','DZ','D&K','Yog','Kevil','TZL','NYC','DJM','NGK','Bosch','Generic'];
  } catch {
    return ['CC','Titan','RZ','Kevla','MRF','Crocodile','DZ','D&K','Yog','Kevil','TZL','NYC','DJM','NGK','Bosch','Generic'];
  }
}
function saveBrands(list) { localStorage.setItem('os_brands', JSON.stringify(list)); }

function showManageBrands() {
  const brands = getBrands();
  showModal(`
    <div class="modal-header">
      <div class="modal-title">Manage Brands</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <label>Add New Brand</label>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input id="new-brand" placeholder="e.g. Yamaha, NGK..." style="margin:0;flex:1"
        onkeydown="if(event.key==='Enter')addBrand()" />
      <button onclick="addBrand()" style="padding:12px 16px;background:var(--accent);color:#000;
        border:none;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap">+ Add</button>
    </div>
    <div class="card-title" style="margin-bottom:10px">Current Brands (${brands.length})</div>
    ${brands.map((b,i) => `
      <div style="display:flex;justify-content:space-between;align-items:center;
        padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:15px;font-weight:600">${b}</span>

          color:var(--red);cursor:pointer;font-size:20px;padding:0 4px">×</button>

  `);
}

function addBrand() {
  const name = (document.getElementById('new-brand')?.value || '').trim();
  if (!name) return;
  const brands = getBrands();
  if (brands.map(b=>b.toLowerCase()).includes(name.toLowerCase())) { toast('Already exists','error'); return; }
  brands.push(name); saveBrands(brands);
  toast(name + ' added ✓','success'); showManageBrands();
}

function deleteBrand(i) {
  const brands = getBrands(); brands.splice(i,1); saveBrands(brands); showManageBrands();
}

// Local Storage DB (used when no backend set)
const DB = {
  get(key) { try { return JSON.parse(localStorage.getItem('os_' + key)) || []; } catch { return []; } },
  set(key, val) { localStorage.setItem('os_' + key, JSON.stringify(val)); },
  getObj(key, def = {}) { try { return JSON.parse(localStorage.getItem('os_' + key)) || def; } catch { return def; } },
};

function localApi(action, data = {}) {
  const now = () => { const d=new Date(),mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${String(d.getDate()).padStart(2,'0')}-${mn[d.getMonth()]}-${d.getFullYear()}`; };
  const uid = () => Date.now() + '-' + Math.random().toString(36).slice(2,5);

  if (action === 'verifyPin') {
    const pin = DB.getObj('settings', { pin:'1234' }).pin || '1234';
    return { success: data.pin === pin };
  }
  if (action === 'getSettings') return { success:true, data: DB.getObj('settings', { shopName:'Oola Spares', pin:'1234', currency:'UGX', ownerName:'Isaac Oola', phone:'' }) };
  if (action === 'saveSettings') { DB.set('settings', { ...DB.getObj('settings',{}), ...data }); return { success:true }; }

  if (action === 'getParts') return { success:true, data: DB.get('parts') };
  if (action === 'savePart') {
    const parts = DB.get('parts');
    if (data.PartID) { const i=parts.findIndex(p=>p.PartID===data.PartID); if(i>=0) parts[i]={...parts[i],...data}; }
    else { data.PartID='PRT-'+uid(); data.CreatedAt=now(); parts.push(data); }
    DB.set('parts', parts); return { success:true, id: data.PartID };
  }
  if (action === 'deletePart') { DB.set('parts', DB.get('parts').filter(p=>p.PartID!==data.PartID)); return {success:true}; }

  if (action === 'getSuppliers') return { success:true, data: DB.get('suppliers') };
  if (action === 'saveSupplier') {
    const list = DB.get('suppliers');
    if (data.SupplierID) { const i=list.findIndex(s=>s.SupplierID===data.SupplierID); if(i>=0) list[i]={...list[i],...data}; }
    else { data.SupplierID='SUP-'+uid(); data.CreatedAt=now(); list.push(data); }
    DB.set('suppliers', list); return { success:true };
  }
  if (action === 'deleteSupplier') { DB.set('suppliers', DB.get('suppliers').filter(s=>s.SupplierID!==data.SupplierID)); return {success:true}; }

  if (action === 'getSupplierRates') {
    let rates = DB.get('supplierRates');
    if (data.PartID) rates = rates.filter(r=>r.PartID===data.PartID);
    if (data.SupplierID) rates = rates.filter(r=>r.SupplierID===data.SupplierID);
    return { success:true, data: rates };
  }
  if (action === 'saveSupplierRate') {
    const list = DB.get('supplierRates');
    if (data.RateID) { const i=list.findIndex(r=>r.RateID===data.RateID); if(i>=0) list[i]={...list[i],...data}; }
    else { data.RateID='RAT-'+uid(); list.push(data); }
    DB.set('supplierRates', list); return { success:true };
  }
  if (action === 'deleteSupplierRate') { DB.set('supplierRates', DB.get('supplierRates').filter(r=>r.RateID!==data.RateID)); return {success:true}; }

  if (action === 'getSales') return { success:true, data: DB.get('sales') };
  if (action === 'saveSale') {
    const list = DB.get('sales'); const parts = DB.get('parts');
    data.SaleID='SAL-'+uid(); data.TotalAmount=(parseFloat(data.Qty)||0)*(parseFloat(data.SellingPrice)||0);
    list.push(data); DB.set('sales', list);
    const pi=parts.findIndex(p=>p.PartID===data.PartID);
    if(pi>=0){ parts[pi].StockQty=Math.max(0,(parseInt(parts[pi].StockQty)||0)-(parseInt(data.Qty)||0)); DB.set('parts',parts); }
    return { success:true };
  }

  if (action === 'getPurchases') return { success:true, data: DB.get('purchases') };
  if (action === 'savePurchase') {
    const list = DB.get('purchases'); const parts = DB.get('parts');
    data.PurchaseID='PUR-'+uid(); data.TotalCost=(parseFloat(data.Qty)||0)*(parseFloat(data.CostPrice)||0);
    list.push(data); DB.set('purchases', list);
    const pi=parts.findIndex(p=>p.PartID===data.PartID);
    if(pi>=0){
      parts[pi].StockQty=(parseInt(parts[pi].StockQty)||0)+(parseInt(data.Qty)||0);
      if(data.updateCostPrice==='true') parts[pi].CostPrice=data.CostPrice;
      DB.set('parts',parts);
    }
    return { success:true };
  }

  if (action === 'getChecklist') return { success:true, data: DB.get('checklist') };
  if (action === 'saveChecklistItem') {
    const list = DB.get('checklist');
    if (data.ItemID) { const i=list.findIndex(c=>c.ItemID===data.ItemID); if(i>=0) list[i]={...list[i],...data}; }
    else { data.ItemID='CHK-'+uid(); data.Status='Pending'; list.push(data); }
    DB.set('checklist', list); return { success:true };
  }
  if (action === 'updateChecklistStatus') {
    const list = DB.get('checklist');
    const i=list.findIndex(c=>c.ItemID===data.ItemID);
    if(i>=0) list[i].Status=data.Status;
    DB.set('checklist', list); return { success:true };
  }
  if (action === 'deleteChecklistItem') { DB.set('checklist', DB.get('checklist').filter(c=>c.ItemID!==data.ItemID)); return {success:true}; }
  if (action === 'clearParts') { DB.set('parts', []); return {success:true}; }

  return { success:false, error:'Unknown action: '+action };
}

// ── Submit guard helpers ──────────────────────────────────
// Returns false if already submitting — prevents double saves
function beginSubmit(btn, loadingText) {
  if (state.submitting) return false;
  state.submitting = true;
  if (btn) {
    btn.dataset.origText = btn.textContent;
    btn.textContent = loadingText || 'Saving...';
    btn.disabled = true;
  }
  return true;
}
function endSubmit(btn, restoreText) {
  state.submitting = false;
  if (btn) {
    btn.textContent = restoreText || btn.dataset.origText || 'Save';
    btn.disabled = false;
  }
}

function pinKey(k) {
  if (pinInput.length >= 4) return;
  pinInput += k;
  updatePinDots();
  if (pinInput.length === 4) setTimeout(checkPin, 100);
}

function pinDel() {
  pinInput = pinInput.slice(0, -1);
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < pinInput.length);
  }
}

async function checkPin() {
  try {
    const res = await api('verifyPin', { pin: pinInput, role: loginRole });
    if (res.success) {
      state.currentRole = res.role || loginRole;
      state.currentUser = res.name || loginRole;
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      applyRoleUI();
  startNotifPolling();
      if (!state.initialized) initApp();
    } else {
      document.getElementById('pin-error').textContent = res.error || 'Wrong PIN. Try again.';
      pinInput = '';
      updatePinDots();
    }
  } catch (e) {
    document.getElementById('pin-error').textContent = 'Connection error.';
    pinInput = '';
    updatePinDots();
  }
}

  if (!isAdmin && ['suppliers'].includes(state.currentView)) {
    showView('dashboard', document.getElementById('nav-dashboard'));
  }
}

async function api(action, data = {}) {
  if (LOCAL_MODE) return localApi(action, data);
  return smartApi(action, data);
}

// ============================================================
// INIT
// ============================================================
async function initApp() {
  state.initialized = true;
  if (LOCAL_MODE) {
    const badge = document.getElementById('local-badge');
    if (badge) badge.style.display = 'inline';
  }

  // Set online/offline indicator
  updateOnlineStatus();

  // Load all data (smartApi handles online/offline automatically)
  await loadAll();
  renderDashboard();

  // If online, check for queued offline changes
  if (!LOCAL_MODE && isOnline) {
    const queue = await IDB.getQueue();
    const writeActions = ['savePart','deletePart','saveSupplier','deleteSupplier',
      'saveSale','updateSale','deleteSale','savePurchase','updatePurchase','deletePurchase',
      'saveChecklistItem','updateChecklistStatus','deleteChecklistItem',
      'saveSupplierRate','deleteSupplierRate','saveSettings',
      'sendOtpNotification','markNotificationRead','requestEditOtp'];
    const writeQueue = (queue || []).filter(item => writeActions.includes(item.action));

    if (writeQueue.length > 0) {
      const syncBtn = document.getElementById('sync-btn');
      if (syncBtn) syncBtn.style.display = 'flex';
      showSyncStatus(writeQueue.length + ' offline change' + (writeQueue.length > 1 ? 's' : '') + ' pending');
      setTimeout(autoSync, 2000);
    } else if (queue.length > 0) {
      // Queue has only read operations — just clear it silently
      await IDB.clearQueue();
    }
  }
}

async function loadAll() {
  const safe = async (action) => {
    try { return await api(action); }
    catch(e) {
      console.error('loadAll failed:', action, e.message);
      return { success: false, data: [], error: e.message };
    }
  };

  // Sequential fetches — Google Apps Script throttles parallel requests
  // which causes some to silently return empty data
  const p  = await safe('getParts');
  const s  = await safe('getSuppliers');
  const r  = await safe('getSupplierRates');
  const sa = await safe('getSales');
  const pu = await safe('getPurchases');
  const ch = await safe('getChecklist');
  const se = await safe('getSettings');

  // Only log if there are actual errors
  const errors = { partsError: p.error, suppError: s.error, salesError: sa.error, purchError: pu.error };
  const hasErrors = Object.values(errors).some(e => e);
  if (hasErrors) console.warn('loadAll errors:', errors);
  else console.log('loadAll OK:', { parts: state.parts.length, suppliers: state.suppliers.length, sales: state.sales.length, purchases: state.purchases.length });

  const rawParts = p.data || [];
  rawParts.sort((a, b) => {
    const na = (a.ItemName||a.Name||'').toLowerCase();
    const nb = (b.ItemName||b.Name||'').toLowerCase();
    if (na !== nb) return na.localeCompare(nb);
    const sa2 = (a.Size||'').toLowerCase();
    const sb2 = (b.Size||'').toLowerCase();
    if (sa2 !== sb2) return sa2.localeCompare(sb2);
    return (a.Brand||a.PartNo||'').toLowerCase().localeCompare((b.Brand||b.PartNo||'').toLowerCase());
  });

  state.parts         = rawParts;
  state.suppliers     = (s.data || []).sort((a,b) => (a.Name||'').localeCompare(b.Name||''));
  state.supplierRates = r.data || [];
  state.sales         = sa.data || [];
  state.purchases     = pu.data || [];
  state.checklist     = ch.data || [];
  state.settings      = se.data || {};

  const totalRecords = state.parts.length + state.suppliers.length + state.sales.length;
  if (totalRecords === 0 && isOnline) {
    _maybeShowConnectionWarning(new Error(p.error || 'Empty response'));
  }
}

function renderDashboard() {
  const parts = state.parts;
  const sales = state.sales;
  const purchases = state.purchases;
  const checklist = state.checklist;
  const today = todayStr();

  const todaySales = sales.filter(s => s.Date === today);
  const todayRev = todaySales.reduce((sum, s) => sum + (parseFloat(s.TotalAmount) || 0), 0);
  const lowStock = parts.filter(p => parseInt(p.StockQty) <= parseInt(p.ReorderLevel));
  const totalValue = parts.reduce((sum, p) => sum + (parseFloat(p.CostPrice) * parseInt(p.StockQty) || 0), 0);
  const pending = checklist.filter(c => c.Status === 'Pending').length;

  const recentSales = [...sales].reverse().slice(0, 5);

  let html = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Today's Sales</div>
        <div class="stat-value accent">${fmtMoney(todayRev)}</div>
        <div class="stat-sub">${todaySales.length} transaction${todaySales.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Stock Value</div>
        <div class="stat-value">${fmtMoney(totalValue)}</div>
        <div class="stat-sub">${parts.length} part types</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Low Stock</div>
        <div class="stat-value ${lowStock.length > 0 ? 'red' : 'green'}">${lowStock.length}</div>
        <div class="stat-sub">items need restock</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Checklist</div>
        <div class="stat-value ${pending > 0 ? 'accent' : 'green'}">${pending}</div>
        <div class="stat-sub">pending items</div>
      </div>
    </div>`;

  if (lowStock.length > 0) {
    html += `<div class="alert-strip">
      <h4>⚠️ Low Stock Alert</h4>
      ${lowStock.slice(0, 4).map(p => `
        <div class="alert-item">
          <span>${p.Name}</span>
          <span>${p.StockQty} left (min ${p.ReorderLevel})</span>
        </div>`).join('')}
      ${lowStock.length > 4 ? `<div class="alert-item"><span>+${lowStock.length - 4} more...</span></div>` : ''}
    </div>`;
  }

  html += `<div class="section-label">Recent Sales</div>`;
  if (recentSales.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">🛒</div><p>No sales yet. Tap + to record one.</p></div>`;
  } else {
    html += recentSales.map(s => `
      <div class="list-item" style="cursor:default">
        <div class="list-item-left">
          <div class="list-item-name">${s.PartName}</div>
          <div class="list-item-sub">${formatDisplayDate(s.Date)} · Qty: ${s.Qty}</div>
        </div>
        <div class="list-item-right">
          <div class="list-item-price">${fmtMoney(s.TotalAmount)}</div>
        </div>
      </div>`).join('');
  }

  document.getElementById('dashboard-content').innerHTML = html;
}

function handleImportDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) processImportFile(file);
}

function handleImportFile(input) {
  const file = input.files[0];
  if (file) processImportFile(file);
}

function processImportFile(file) {
  const reader = new FileReader();
  const isCSV = file.name.toLowerCase().endsWith('.csv');

  reader.onload = function(e) {
    try {
      let rows = [];
      if (isCSV) {
        rows = parseCSV(e.target.result);
      } else {
        // Parse XLSX using simple binary approach
        rows = parseXLSXSimple(e.target.result);
      }
      if (rows.length < 2) { toast('File appears empty', 'error'); return; }
      showImportPreview(rows);
    } catch(err) {
      toast('Could not read file: ' + err.message, 'error');
    }
  };

  if (isCSV) reader.readAsText(file);
  else reader.readAsBinaryString(file);
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  return lines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let c of line) {
      if (c === '"') inQ = !inQ;
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim());
    return cols;
  });
}

function parseXLSXSimple(binary) {
  // Extract strings from XLSX shared strings (works for simple spreadsheets)
  // XLSX is a ZIP - we look for the XML content
  const rows = [];
  try {
    // Try to find tab-separated content (extract-text output format)
    // For basic xlsx, find all <v> and <t> tags
    let i = 0;
    const decoder = [];

    // Simple approach: look for string patterns in the binary
    // Find sharedStrings.xml content
    const ssStart = binary.indexOf('<?xml version="1.0"');
    if (ssStart === -1) throw new Error('Not a valid XLSX file');

    // Better: parse as text and look for comma/tab separated values
    // Since we cannot use JSZip, show manual CSV option
    toast('Please save your Excel as CSV first, then upload', 'error');
    showImportCSVHelp();
    return [];
  } catch(e) {
    throw e;
  }
}

async function confirmCSVImport(rows, ni, ci, si, bi, costi, selli, qi, mi) {
  showModal(`<div style="padding:32px;text-align:center"><div class="spin" style="font-size:32px">⟳</div><div style="margin-top:12px;font-weight:700">Importing ${rows.length} items...</div></div>`);

  let done = 0, skipped = 0;
  const catMap = {engine:'Engine',transmission:'Transmission',brakes:'Brakes',electrical:'Electrical',body:'Body/Panel',suspension:'Suspension',fuel:'Fuel System',tyre:'Tyres & Tubes',filter:'Filters',bearing:'Bearings & Seals',gasket:'Gaskets'};

  for (const row of rows) {
    const name = (row[ni]||'').trim();
    if (!name) { skipped++; continue; }

    const rawCat = (ci>=0 ? row[ci] : '') || '';
    const cat = catMap[rawCat.toLowerCase().split('/')[0].trim()] || rawCat || 'Other';
    const size = (si>=0 ? row[si] : '') || '';
    const brand = (bi>=0 ? row[bi] : '') || '';
    const fullName = name + (size?' '+size:'') + (brand?' - '+brand:'');
    const move = (mi>=0 ? row[mi] : '') || 'Medium';

    await api('savePart', {
      PartID: '', Name: fullName, Category: cat,
      PartNo: brand, Description: size,
      CostPrice: (costi>=0 ? parseFloat(row[costi])||0 : 0),
      SellingPrice: (selli>=0 ? parseFloat(row[selli])||0 : 0),
      StockQty: (qi>=0 ? parseInt(row[qi])||0 : 0),
      ReorderLevel: 5, Unit: 'Piece',
      Movement: move
    });
    done++;
  }

  await loadAll();
  closeModal();
  renderParts();
  renderDashboard();
  toast(`Imported ${done} items ✓`, 'success');
}

async function runBajajImport() {
  const btn = document.getElementById('confirm-import-btn');
  if (btn) { btn.textContent = 'Importing...'; btn.disabled = true; }

  const existing = new Set(state.parts.map(p => p.Name.toLowerCase()));
  const toImport = BAJAJ_ITEMS.filter(item => !existing.has(item.name.toLowerCase()));
  let done = 0;

  for (const item of toImport) {
    await api('savePart', {
      PartID: '', Name: item.name, Category: item.cat,
      PartNo: '', Description: '',
      CostPrice: 0, SellingPrice: 0,
      StockQty: 0, ReorderLevel: 5,
      Unit: 'Piece', Movement: item.move

  }

  await loadAll();
  closeModal();
  renderParts();
  renderDashboard();
  toast(`${done} items imported ✓`, 'success');
}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">${itemBtns}</div>

        <label>Or type a custom item name</label>
        <input id="w-custom" placeholder="e.g. Horn, Mirror..." value="${data.customItem?data.itemName:''}"
          oninput="wizard.data.itemName=this.value;wizard.data.customItem=true;wizard.data.cat='';wizard.data.size='';wizard.data.brand=''" />
        ${data.customItem&&data.itemName?`
          <label>Category</label>

  } else if (step === 2) {

          <div onclick="wizard.data.move='${m}';renderWizard()" style="

            border:2px solid ${data.move===m?color:'var(--border)'};

  // ── STEP 3: PRICE ──
  } else if (step === 3) {
    const brandsToPrice = Array.isArray(data.brands) && data.brands.length > 0
      ? data.brands : (data.brand ? [data.brand] : ['']);

    // Init per-brand prices if not set

    brandsToPrice.forEach(b => {

    const baseName = data.itemName + (data.size ? ' ' + data.size : '');
    const existingPrices = state.parts
      .filter(p => p.Name.toLowerCase().startsWith(baseName.toLowerCase()) && p.PartNo)
      .map(p => ({ brand: p.PartNo, cost: p.CostPrice, sell: p.SellingPrice }));

    const refHtml = existingPrices.length > 0 ? `
      <div style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:6px">Reference prices</div>

    const singleHtml = isSingle ? `

      <input id="bp-cost-0" type="number" inputmode="numeric" placeholder="0"

        style="font-size:22px;font-weight:800;padding:16px;font-family:var(--mono);color:var(--accent)"
        oninput="wizard.data.brandPrices['${brandsToPrice[0]}'].sell=this.value;updateSingleMargin()" />
      <div style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2)">

        <span id="mp-val" style="font-family:var(--mono);font-weight:700;color:var(--green)">
          ${bp[brandsToPrice[0]]?.cost && bp[brandsToPrice[0]]?.sell
            ? fmtMoney(parseFloat(bp[brandsToPrice[0]].sell) - parseFloat(bp[brandsToPrice[0]].cost))
            : '—'}

      </div>` : '';

    // Multiple brands — table layout
    const multiHtml = !isSingle ? `
      ${refHtml}
      <div style="background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.15);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--text2)">
        💡 Fill prices per brand. Tap <strong>copy icon</strong> to match a row to the one above it.
      </div>

      <div style="display:grid;grid-template-columns:80px 1fr 1fr 32px;gap:6px;padding:0 4px;margin-bottom:4px">
        <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase">Brand</div>
        <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase">Cost (UGX)</div>
        <div style="font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase">Sell (UGX)</div>
        <div></div>
      </div>

      ${brandsToPrice.map((b, i) => `
        <div style="display:grid;grid-template-columns:80px 1fr 1fr 32px;gap:6px;align-items:center;margin-bottom:6px">
          <div style="font-size:12px;font-weight:700;color:#3b82f6;padding:8px 4px;background:rgba(59,130,246,.08);border-radius:8px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b}</div>

          <div onclick="copyPriceFromAbove(${i},'${b}')" style="

        <button onclick="applyAllSameCost()" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11px;font-weight:700;cursor:pointer">

  } else if (step === 4) {

      ${summaryPill}

          </select>
        </div>
        <div>
          <label>Reorder Alert at</label>
          <input id="w-reorder" type="number" inputmode="numeric" value="${data.reorder||5}"
            oninput="wizard.data.reorder=this.value" />

      <select id="w-supplier" onchange="wizard.data.supplier=this.value" style="margin-bottom:10px">
        <option value="">-- No Supplier --</option>
        ${state.suppliers.map(s => `<option value="${s.Name}" ${data.supplier===s.Name?'selected':''}>${s.Name}</option>`).join('')}
      </select>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">
        <button class="btn btn-ghost" onclick="wizardBack()">← Back</button>
        <button class="btn btn-primary" onclick="savePartWizard()" id="w-save-btn">

  }

  showModal(body);
  setTimeout(() => {
    const first = document.querySelector('#modal-body input:not([type=hidden])');
    if (first && step > 1) first.focus();
  }, 80);
}

function selectItem(name) {
  const item = BAJAJ_ITEMS.find(i => i.name === name);
  wizard.data.itemName = name;
  wizard.data.cat = item?.cat || '';
  wizard.data.move = item?.move || 'Medium';
  wizard.data.customItem = false;
  wizard.data.size = '';
  wizard.data.brand = '';
  wizard.data.brands = [];
  renderWizard();
}

function selectCat(cat) { wizard.data.cat = cat; renderWizard(); }

function toggleBrand(b) {
  if (!Array.isArray(wizard.data.brands)) {
    wizard.data.brands = wizard.data.brand ? [wizard.data.brand] : [];
  }
  const idx = wizard.data.brands.indexOf(b);
  if (idx >= 0) wizard.data.brands.splice(idx, 1);
  else wizard.data.brands.push(b);
  wizard.data.brand = wizard.data.brands[0] || '';
  renderWizard();
}

function quickPickPart(name, cat, no) {
  wizard.data.itemName = name; wizard.data.cat = cat;
  wizard.data.customItem = false; wizard.step = 2;
  renderWizard();
}

function wizardNext(fromStep) {
  if (fromStep === 1) {
    if (document.getElementById('w-custom')) {
      wizard.data.itemName = val('w-custom') || wizard.data.itemName;
      if (document.getElementById('w-custom-cat')) wizard.data.cat = val('w-custom-cat') || wizard.data.cat;
    }
    if (!wizard.data.itemName) { toast('Select or type an item', 'error'); return; }
    if (wizard.data.customItem && !wizard.data.cat) { toast('Select a category', 'error'); return; }
  }
  if (fromStep === 2) {
    if (document.getElementById('w-size')) wizard.data.size = val('w-size') || wizard.data.size;
    // Handle typed brand input
    const typedBrand = document.getElementById('w-brand') ? val('w-brand') : '';
    if (typedBrand) {
      if (!Array.isArray(wizard.data.brands)) wizard.data.brands = [];
      if (!wizard.data.brands.includes(typedBrand)) wizard.data.brands.push(typedBrand);
      wizard.data.brand = wizard.data.brands[0] || typedBrand;
    }
    if (!Array.isArray(wizard.data.brands)) wizard.data.brands = wizard.data.brand ? [wizard.data.brand] : [];
  }
  if (fromStep === 3) {
    const brands3 = Array.isArray(wizard.data.brands) && wizard.data.brands.length > 0
      ? wizard.data.brands : [wizard.data.brand || ''];
    if (!wizard.data.brandPrices) wizard.data.brandPrices = {};
    // Capture any typed values from DOM inputs
    brands3.forEach((b, i) => {
      const costEl = document.getElementById('bp-cost-' + i) || document.getElementById('bp-cost-0');
      const sellEl = document.getElementById('bp-sell-' + i) || document.getElementById('bp-sell-0');
      if (costEl || sellEl) {
        wizard.data.brandPrices[b] = {
          cost: costEl?.value || wizard.data.brandPrices[b]?.cost || '',
          sell: sellEl?.value || wizard.data.brandPrices[b]?.sell || ''
        };
      }
    });
    // Validate at least one brand has both prices
    const hasPrice = brands3.some(b => wizard.data.brandPrices[b]?.cost && wizard.data.brandPrices[b]?.sell);
    if (!hasPrice) { toast('Enter at least one cost & selling price', 'error'); return; }
    // Set fallback cost/sell for compatibility
    const firstBrand = brands3[0];
    wizard.data.cost = wizard.data.brandPrices[firstBrand]?.cost || '';
    wizard.data.sell = wizard.data.brandPrices[firstBrand]?.sell || '';
  }
  wizard.step++;
  renderWizard();
}

function wizardBack() {
  if (wizard.step === 3) { wizard.data.cost = val('w-cost'); wizard.data.sell = val('w-sell'); }
  if (wizard.step === 4) { wizard.data.qty = val('w-qty'); wizard.data.reorder = val('w-reorder'); }
  wizard.step--;
  renderWizard();
}

function stepQty(delta) {
  const input = document.getElementById('w-qty');
  const newVal = Math.max(0, (parseInt(input?.value)||0) + delta);
  if (input) input.value = newVal;
  wizard.data.qty = newVal;
}

function updateMarginPreview() {
  const cost = parseFloat(document.getElementById('w-cost')?.value)||0;
  const sell = parseFloat(document.getElementById('w-sell')?.value)||0;
  const el = document.getElementById('mp-val');
  if (!el) return;
  if (cost && sell) {
    const profit = sell - cost;
    el.style.color = profit >= 0 ? 'var(--green)' : 'var(--red)';
    el.textContent = fmtMoney(profit) + ' (' + Math.round((profit/cost)*100) + '%)';
  } else el.textContent = '—';
}

function updateSingleMargin() {
  const brands = Array.isArray(wizard.data.brands) && wizard.data.brands.length > 0
    ? wizard.data.brands : [wizard.data.brand || ''];
  const b = brands[0];
  const cost = parseFloat(document.getElementById('bp-cost-0')?.value)||0;
  const sell = parseFloat(document.getElementById('bp-sell-0')?.value)||0;
  if (wizard.data.brandPrices && b) {
    wizard.data.brandPrices[b] = { cost, sell };
  }
  const el = document.getElementById('mp-val');
  if (!el) return;
  if (cost && sell) {
    const profit = sell - cost;
    el.style.color = profit >= 0 ? 'var(--green)' : 'var(--red)';
    el.textContent = fmtMoney(profit) + ' (' + Math.round((profit/cost)*100) + '%)';
  } else el.textContent = '—';
}

function copyPriceFromAbove(idx, brand) {
  if (idx === 0) return;
  const brands = Array.isArray(wizard.data.brands) ? wizard.data.brands : [];
  const above = brands[idx - 1];
  if (!above || !wizard.data.brandPrices) return;
  const abovePrices = wizard.data.brandPrices[above] || {};
  wizard.data.brandPrices[brand] = { ...abovePrices };
  renderWizard();
}

function applyRefPrice(brand, cost, sell) {
  if (!wizard.data.brandPrices) wizard.data.brandPrices = {};
  const brands = Array.isArray(wizard.data.brands) && wizard.data.brands.length > 0
    ? wizard.data.brands : [wizard.data.brand || ''];
  brands.forEach(b => {
    wizard.data.brandPrices[b] = { cost, sell };
  });
  renderWizard();
}

function applyAllSameCost() {
  if (!wizard.data.brandPrices) return;
  const brands = Array.isArray(wizard.data.brands) ? wizard.data.brands : [];
  // Get cost from first filled row
  const firstCost = Object.values(wizard.data.brandPrices).find(p => p.cost)?.cost || '';
  if (!firstCost) { toast('Fill in a cost price first', 'error'); return; }
  brands.forEach(b => {
    if (!wizard.data.brandPrices[b]) wizard.data.brandPrices[b] = { cost: firstCost, sell: '' };
    else wizard.data.brandPrices[b].cost = firstCost;
  });
  renderWizard();
}

function applyAllSameSell() {
  if (!wizard.data.brandPrices) return;
  const brands = Array.isArray(wizard.data.brands) ? wizard.data.brands : [];
  const firstSell = Object.values(wizard.data.brandPrices).find(p => p.sell)?.sell || '';
  if (!firstSell) { toast('Fill in a selling price first', 'error'); return; }
  brands.forEach(b => {
    if (!wizard.data.brandPrices[b]) wizard.data.brandPrices[b] = { cost: '', sell: firstSell };
    else wizard.data.brandPrices[b].sell = firstSell;
  });
  renderWizard();
}

    <div class="modal-header">
      <div class="modal-title">Edit Part</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <label>Item Name *</label>
    <input id="e-name" value="${(p.ItemName||p.Name||'').replace(/"/g,'&quot;')}"
      style="font-size:16px;font-weight:700" placeholder="e.g. Spark Plug" />

    <div class="form-row">
      <div>
        <label>Brand</label>

          <option value="">-- No Brand --</option>
          ${brands.map(b => `<option value="${b}" ${(p.Brand||p.PartNo)===b?'selected':''}>${b}</option>`).join('')}

            ? `<option value="${p.Brand||p.PartNo}" selected>${p.Brand||p.PartNo}</option>` : ''}
        </select>
      </div>

async function saveDirectEdit(partId) {
  const p = state.parts.find(x => x.PartID === partId);
  if (!p) return;

  const itemName = val('e-name');
  const brand    = val('e-brand');
  // Never let size = brand (prevent duplication)
  const rawSize  = val('e-size');
  const size     = (rawSize && brand && rawSize.toLowerCase() === brand.toLowerCase()) ? '' : rawSize;
  const cat      = val('e-cat');
  const cost     = val('e-cost');
  const sell     = val('e-sell');
  const qty      = val('e-qty');
  const reorder  = val('e-reorder');
  const unit     = val('e-unit');
  const move     = val('e-move');

  if (!itemName) { toast('Item name required', 'error'); return; }
  if (!cost || !sell) { toast('Enter cost and selling price', 'error'); return; }

  const parts = [itemName];
  if (size) parts.push(size);
  if (brand) parts.push('- ' + brand);
  const fullName = parts.join(' ').replace(/\s+/g,' ').trim();

  const btn = document.querySelector('#modal-body .btn-primary');
  if (!beginSubmit(btn, 'Saving...')) return;

  try {
    const res = await api('savePart', {
      PartID: partId, Name: fullName, ItemName: itemName,
      Size: size, Brand: brand, PartNo: brand, Description: size,
      Category: cat, CostPrice: cost, SellingPrice: sell,
      StockQty: qty, ReorderLevel: reorder, Unit: unit, Movement: move,
      SupplierName: val('e-supplier') || '', CreatedAt: p.CreatedAt || ''
    });
    if (res.success) {
      await autoSyncRateFromPart(partId, fullName, val('e-supplier') || '', cost);
      await loadAll(); closeModal(); renderParts(); renderDashboard();
      toast(fullName + ' updated ✓', 'success');
    } else {
      toast(res.error || 'Save failed', 'error');
      endSubmit(btn, '✓ Save Changes');
    }
  } catch(e) {
    toast('Error saving part', 'error');
    endSubmit(btn, '✓ Save Changes');
  }
}

function buildPartName(d) {
  // Builds display name: "Tube 2.75-17 - Keula"
  // Don't repeat brand in size position
  const cleanSize = (d.size && d.brand && d.size.toLowerCase() === d.brand.toLowerCase()) ? '' : (d.size || '');
  let name = d.itemName;
  if (cleanSize) name += ' ' + cleanSize;
  if (d.brand) name += ' - ' + d.brand;
  return name;
}

async function savePartWizard() {
  const d = wizard.data;
  d.qty = val('w-qty') || d.qty || 0;
  d.reorder = val('w-reorder') || d.reorder || 5;
  d.unit = val('w-unit') || d.unit;

  const btn = document.getElementById('w-save-btn');
  if (!beginSubmit(btn, 'Saving...')) return;

  // Get all brands to save
  const brandsToSave = Array.isArray(d.brands) && d.brands.length > 0
    ? d.brands
    : (d.brand ? [d.brand] : ['']);

  // Single edit — just update one
  if (wizard.editId) {
    const b0 = brandsToSave[0];
    const cleanSize0 = (d.size && b0 && d.size.toLowerCase() === b0.toLowerCase()) ? '' : (d.size || '');
    const fullName = buildPartName({ ...d, brand: b0, size: cleanSize0 });
    const res = await api('savePart', {
      PartID: wizard.editId,
      Name: fullName,
      ItemName: d.itemName,
      Size: cleanSize0,
      Brand: b0,
      PartNo: b0,
      Description: cleanSize0,
      Category: d.cat,
      CostPrice: d.cost, SellingPrice: d.sell,
      StockQty: d.qty, ReorderLevel: d.reorder,
      Unit: d.unit, Movement: d.move || 'Medium',
      SupplierName: d.supplier || ''
    });
    if (res.success) {
      await autoSyncRateFromPart(wizard.editId, fullName, d.supplier || '', d.cost);
      await loadAll(); closeModal(); renderParts(); renderDashboard();
      toast('Updated ✓', 'success');
    } else {
      toast(res.error || 'Error saving', 'error');
      endSubmit(btn, '✓ Save Changes');
    }
    return;
  }

  // Multiple brands — save one entry per brand with individual prices
  let done = 0;
  for (const brand of brandsToSave) {
    const fullName = buildPartName({ ...d, brand });
    const bp = d.brandPrices && d.brandPrices[brand] ? d.brandPrices[brand] : { cost: d.cost, sell: d.sell };
    // Skip brands with no prices set
    if (!bp.cost && !bp.sell) continue;
    const res = await api('savePart', {
      PartID: '',
      Name: fullName, Category: d.cat,
      PartNo: brand, Description: d.size,
      CostPrice: bp.cost || d.cost, SellingPrice: bp.sell || d.sell,
      StockQty: d.qty, ReorderLevel: d.reorder,
      Unit: d.unit, Movement: d.move || 'Medium',
      SupplierName: d.supplier || ''
    });
    if (res.success) {
      done++;
      if (res.id) await autoSyncRateFromPart(res.id, fullName, d.supplier || '', bp.cost || d.cost);
    }
    if (btn) btn.textContent = `Saving... ${done}/${brandsToSave.length}`;
  }

  await loadAll(); closeModal(); renderParts(); renderDashboard();
  state.submitting = false; // release guard after multi-brand loop
  toast(done === 1
    ? buildPartName({ ...d, brand: brandsToSave[0] }) + ' added ✓'
    : done + ' entries added ✓ (' + brandsToSave.join(', ') + ')',
    'success');
}

function handleImportDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) processImportFile(file);
}

function handleImportFile(input) {
  const file = input.files[0];
  if (file) processImportFile(file);
}

function processImportFile(file) {
  const reader = new FileReader();
  const isCSV = file.name.toLowerCase().endsWith('.csv');

  reader.onload = function(e) {
    try {
      let rows = [];
      if (isCSV) {
        rows = parseCSV(e.target.result);
      } else {
        // Parse XLSX using simple binary approach
        rows = parseXLSXSimple(e.target.result);
      }
      if (rows.length < 2) { toast('File appears empty', 'error'); return; }
      showImportPreview(rows);
    } catch(err) {
      toast('Could not read file: ' + err.message, 'error');
    }
  };

  if (isCSV) reader.readAsText(file);
  else reader.readAsBinaryString(file);
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  return lines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let c of line) {
      if (c === '"') inQ = !inQ;
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim());
    return cols;
  });
}

function parseXLSXSimple(binary) {
  // Extract strings from XLSX shared strings (works for simple spreadsheets)
  // XLSX is a ZIP - we look for the XML content
  const rows = [];
  try {
    // Try to find tab-separated content (extract-text output format)
    // For basic xlsx, find all <v> and <t> tags
    let i = 0;
    const decoder = [];

    // Simple approach: look for string patterns in the binary
    // Find sharedStrings.xml content
    const ssStart = binary.indexOf('<?xml version="1.0"');
    if (ssStart === -1) throw new Error('Not a valid XLSX file');

    // Better: parse as text and look for comma/tab separated values
    // Since we cannot use JSZip, show manual CSV option
    toast('Please save your Excel as CSV first, then upload', 'error');
    showImportCSVHelp();
    return [];
  } catch(e) {
    throw e;
  }
}
