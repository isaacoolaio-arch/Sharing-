async function confirmCSVImport(rows, ni, ci, si, bi, costi, selli, qi, mi) {
  showModal(`<div style="padding:32px;text-align:center"><div class="spin" style="font-size:32px">⟳</div><div style="margin-top:12px;font-weight:700">Importing ${rows.length} items...</div></div>`);

  let done = 0, skipped = 0;
  const catMap = {engine:'Engine',transmission:'Transmission',brakes:'Brakes',electrical:'Electrical',body:'Body/Panel',suspension:'Suspension',fuel:'Fuel System',tyre:'Tyres & Tubes',filter:'Filters',bearing:'Bearings & Seals',gasket:'Gaskets'};

  for (const row of rows) {
    const name = (row[ni]||'').trim();
    if (!name) { skipped++; continue; }

    const rawCat = (ci>=0 ? row[ci] : '') || '';
    const cat = catMap[rawCat.toLowerCase().split('/')[0].trim()] || rawCat || 'Other';
    const size = (si>=0 ? row[si] : '') || '';
    const brand = (bi>=0 ? row[bi] : '') || '';
    const fullName = name + (size?' '+size:'') + (brand?' - '+brand:'');
    const move = (mi>=0 ? row[mi] : '') || 'Medium';

    await api('savePart', {
      PartID: '', Name: fullName, Category: cat,
      PartNo: brand, Description: size,
      CostPrice: (costi>=0 ? parseFloat(row[costi])||0 : 0),
      SellingPrice: (selli>=0 ? parseFloat(row[selli])||0 : 0),
      StockQty: (qi>=0 ? parseInt(row[qi])||0 : 0),
      ReorderLevel: 5, Unit: 'Piece',
      Movement: move
    });
    done++;
  }

  await loadAll();
  closeModal();
  renderParts();
  renderDashboard();
  toast(`Imported ${done} items ✓`, 'success');
}

function renderParts() {

  const categories = ['All', ...new Set(parts.map(p => p.Category).filter(Boolean))];

    `<div class="tab ${c === state.partCategoryFilter ? 'active' : ''}" onclick="filterByCategory('${c}', this)">${c}</div>`
  ).join('');

  const moveEl = document.getElementById('move-filter-row');

    const moves = [['All','All','var(--text2)'],['Fast','🔥 Fast','#ef4444'],['Medium','⚡ Medium','#f0a500'],['Slow','🐢 Slow','#3b82f6'],['Dead','❄️ Dead','#555']];

        style="${state.partMoveFilter===v?'background:'+color+';border-color:'+color+';color:#000':''}"

    ).join('');

  filterParts();

function setMoveFilter(v) {
  state.partMoveFilter = v;

}

function filterByCategory(cat, el) {
  state.partCategoryFilter = cat;
  document.querySelectorAll('#parts-tabs .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterParts();
}

function filterParts() {
  const q = (document.getElementById('parts-search')?.value || '').trim();
  let parts = [...state.parts]; // copy to avoid mutating state
  if (state.partCategoryFilter !== 'All') parts = parts.filter(p => p.Category === state.partCategoryFilter);
  if (state.partMoveFilter && state.partMoveFilter !== 'All') parts = parts.filter(p => (p.Movement||'Medium') === state.partMoveFilter);
  if (q) {
    parts = parts.filter(p => {
      const txt = [p.ItemName||'', p.Name||'', p.Brand||'', p.PartNo||'', p.Size||'', p.Category||''].join(' ');
      return smartMatch(txt, q);
    });
  }
  // Always sort by ItemName → Size → Brand
  parts.sort((a, b) => {
    const na = (a.ItemName||a.Name||'').toLowerCase();
    const nb = (b.ItemName||b.Name||'').toLowerCase();
    if (na !== nb) return na.localeCompare(nb);
    const sa = (a.Size||'').toLowerCase();
    const sb = (b.Size||'').toLowerCase();
    if (sa !== sb) return sa.localeCompare(sb);
    return (a.Brand||a.PartNo||'').toLowerCase().localeCompare((b.Brand||b.PartNo||'').toLowerCase());
  });
  if (parts.length === 0) {
    document.getElementById('parts-list').innerHTML = `<div class="empty-state"><div class="empty-icon">🔩</div><p>No parts found.</p></div>`;
    return;
  }

  document.getElementById('parts-list').innerHTML = parts.map(p => {
    const qty = parseInt(p.StockQty) || 0;
    const reorder = parseInt(p.ReorderLevel) || 5;
    const isLow = qty <= reorder;
    const badge = isLow ? `<span class="badge badge-low">Low</span>` : `<span class="badge badge-ok">OK</span>`;
    const moveIcon = {Fast:'🔥',Medium:'⚡',Slow:'🐢',Dead:'❄️'}[p.Movement]||'⚡';
    return `

function showPartDetail(partId) {
  const part = state.parts.find(p => p.PartID === partId);
  if (!part) return;
  const rates = state.supplierRates.filter(r => r.PartID === partId);
  const profit = (parseFloat(part.SellingPrice) || 0) - (parseFloat(part.CostPrice) || 0);
  const margin = parseFloat(part.CostPrice) > 0 ? ((profit / parseFloat(part.CostPrice)) * 100).toFixed(0) : 0;

  let rateHtml = rates.length === 0 ? `<p style="color:var(--text3);font-size:13px">No supplier rates added.</p>` : '';
  if (rates.length > 0) {
    const minRate = Math.min(...rates.map(r => parseFloat(r.UnitPrice)));
    rateHtml = rates.map(r => {
      const isBest = parseFloat(r.UnitPrice) === minRate;
      return `<div class="rate-row">
        <div>
          <div class="rate-supplier">${r.SupplierName} ${isBest ? '⭐' : ''}</div>
          ${r.Notes ? `<div style="font-size:11px;color:var(--text3)">${r.Notes}</div>` : ''}
        </div>
        <div class="rate-price ${isBest ? 'rate-best' : ''}">${fmtMoney(r.UnitPrice)}</div>
      </div>`;
    }).join('');
  }

  const moveIcon = {Fast:'🔥',Medium:'⚡',Slow:'🐢',Dead:'❄️'}[part.Movement]||'⚡';
  const isLow = parseInt(part.StockQty) <= parseInt(part.ReorderLevel);

  showModal(`
    <div class="modal-header">
      <div>
        <div class="modal-title">${part.ItemName || part.Name}</div>
        <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
          ${part.Brand||part.PartNo ? `<span class="badge" style="background:rgba(59,130,246,.12);color:#3b82f6">${part.Brand||part.PartNo}</span>` : ''}
          ${part.Size ? `<span class="badge badge-warn">${part.Size}</span>` : ''}
          <span class="badge" style="background:var(--surface2);color:var(--text3)">${part.Category}</span>
          <span style="font-size:13px">${moveIcon}</span>
        </div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="stat-grid" style="margin-bottom:14px">
      <div class="stat-card">
        <div class="stat-label">Cost Price</div>
        <div class="stat-value" style="font-size:18px">${fmtMoney(part.CostPrice)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Selling Price</div>
        <div class="stat-value accent" style="font-size:18px">${fmtMoney(part.SellingPrice)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">In Stock</div>
        <div class="stat-value ${isLow?'red':'green'}" style="font-size:22px">${part.StockQty||0}</div>
        <div class="stat-sub ${isLow?'':''}">min ${part.ReorderLevel||5}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Profit/unit</div>
        <div class="stat-value green" style="font-size:18px">${fmtMoney(profit)}</div>
        <div class="stat-sub">${margin}% margin</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <button class="btn btn-ghost" onclick="closeModal();setTimeout(()=>showEditPartModal('${partId}'),100)">
        ✏️ Edit Details
      </button>
      <button onclick="closeModal();setTimeout(()=>quickAdjustStock('${partId}','${part.ItemName||part.Name}',${part.StockQty||0}),100)"
        style="padding:13px;border-radius:12px;border:1px solid rgba(34,197,94,.3);background:rgba(34,197,94,.08);
        color:var(--green);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer">
        📦 Adjust Stock
      </button>
    </div>

      <button onclick="adjStep(-1)" style="width:52px;height:52px;border-radius:12px;background:var(--surface2);

function adjStep(d) {
  const el = document.getElementById('adj-qty');
  if (el) el.value = Math.max(0, (parseInt(el.value)||0) + d);
}

async function saveStockAdj(partId) {
  const newQty = parseInt(document.getElementById('adj-qty')?.value) || 0;
  const part = state.parts.find(p => p.PartID === partId);
  if (!part) return;
  const res = await api('savePart', { ...part, PartID: partId, StockQty: newQty });
  if (res.success) {
    await loadAll(); closeModal(); renderParts(); renderDashboard();
    toast('Stock updated ✓', 'success');

// Called silently after saving a part or recording a purchase.
// Creates/updates a SupplierRate when part has Supplier + CostPrice > 0.
async function autoSyncRateFromPart(partId, partName, supplierName, costPrice) {
  if (!supplierName || !costPrice || parseFloat(costPrice) <= 0) return;
  const sup = state.suppliers.find(s => s.Name === supplierName);
  if (!sup) return; // supplier not in list — skip silently
  const existing = state.supplierRates.find(
    r => r.PartID === partId && r.SupplierID === sup.SupplierID
  );
  const newPrice = parseFloat(costPrice);
  if (existing && parseFloat(existing.UnitPrice) === newPrice) return; // no change
  await api('saveSupplierRate', {
    RateID: existing ? (existing.RateID || '') : '',
    SupplierID: sup.SupplierID,
    SupplierName: sup.Name,
    PartID: partId,
    PartName: partName,
    UnitPrice: newPrice,
    Notes: existing ? (existing.Notes || '') : 'Auto-extracted from Parts'
  });
  // Quietly refresh rates in state
  try {
    const r = await api('getSupplierRates', {});
    if (r.success && r.data) state.supplierRates = r.data;
  } catch(e) {}
}

// One-time bulk backfill: reads all parts and creates SupplierRate
// for every part that already has both Supplier + CostPrice saved.
async function extractRatesFromAllParts() {
  const eligible = state.parts.filter(p =>
    p.SupplierName && parseFloat(p.CostPrice) > 0
  );
  if (eligible.length === 0) {
    toast('No parts have both a Supplier + Cost Price set', 'error');
    return;
  }
  closeModal();
  setTimeout(() => {
    showModal(`
      <div class="modal-header">
        <div class="modal-title">Extract Supplier Rates</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.7">
        Found <strong style="color:var(--accent)">${eligible.length} parts</strong> with a supplier and cost price saved.<br><br>
        This will create or update a SupplierRate entry for each one. Parts without a supplier set will be skipped.
      </div>
      <div style="max-height:200px;overflow-y:auto;margin-bottom:16px">
        ${eligible.map(p => `
          <div style="display:flex;justify-content:space-between;padding:6px 0;
            border-bottom:1px solid var(--border);font-size:12px">
            <span style="font-weight:600">${p.ItemName||p.Name}</span>
            <span style="color:var(--accent);font-family:var(--mono)">${p.SupplierName} · ${fmtMoney(p.CostPrice)}</span>
          </div>`).join('')}
      </div>
      <button class="btn btn-primary" id="extract-btn" onclick="runExtractRates()">
        ✓ Extract ${eligible.length} Rates
      </button>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Cancel</button>
    `);
  }, 100);
}

async function runExtractRates() {
  const btn = document.getElementById('extract-btn');
  if (btn) { btn.textContent = 'Extracting...'; btn.disabled = true; }
  const eligible = state.parts.filter(p =>
    p.SupplierName && parseFloat(p.CostPrice) > 0
  );
  let done = 0, skipped = 0;
  for (const p of eligible) {
    const sup = state.suppliers.find(s => s.Name === p.SupplierName);
    if (!sup) { skipped++; continue; }
    const existing = state.supplierRates.find(
      r => r.PartID === p.PartID && r.SupplierID === sup.SupplierID
    );
    const newPrice = parseFloat(p.CostPrice);
    if (existing && parseFloat(existing.UnitPrice) === newPrice) { skipped++; continue; }
    await api('saveSupplierRate', {
      RateID: existing ? (existing.RateID || '') : '',
      SupplierID: sup.SupplierID,
      SupplierName: sup.Name,
      PartID: p.PartID,
      PartName: p.Name,
      UnitPrice: newPrice,
      Notes: existing ? (existing.Notes || '') : 'Auto-extracted from Parts'
    });
    done++;
    if (btn) btn.textContent = `Extracting... ${done}/${eligible.length}`;
  }
  await loadAll();
  closeModal();
  toast(`${done} rate${done !== 1 ? 's' : ''} extracted ✓${skipped ? ' (' + skipped + ' skipped)' : ''}`, 'success');
}

function switchReqTab(tab) {
  window._reqTab = tab;
  document.getElementById('req-sales-wrap').style.display = tab === 'sales' ? '' : 'none';
  document.getElementById('req-purch-wrap').style.display = tab === 'purchases' ? '' : 'none';
  // Tab button styles
  document.getElementById('req-tab-sales').style.background   = tab === 'sales'     ? 'var(--accent)' : 'var(--surface2)';
  document.getElementById('req-tab-sales').style.color        = tab === 'sales'     ? '#000'          : 'var(--text2)';
  document.getElementById('req-tab-purchases').style.background = tab === 'purchases' ? 'var(--accent)' : 'var(--surface2)';
  document.getElementById('req-tab-purchases').style.color      = tab === 'purchases' ? '#000'          : 'var(--text2)';
  // Reset preview & button
  document.getElementById('req-preview').style.display = 'none';
  const btn = document.getElementById('req-btn');
  btn.style.opacity = '.4'; btn.style.pointerEvents = 'none';
}

function onReqRecordChange() {
  const tab = window._reqTab || 'sales';
  const sel = document.getElementById(tab === 'sales' ? 'req-sale-sel' : 'req-purch-sel');
  const v = sel?.value || '';
  const preview = document.getElementById('req-preview');
  const btn = document.getElementById('req-btn');

  if (!v) {
    preview.style.display = 'none';
    btn.style.opacity = '.4'; btn.style.pointerEvents = 'none';
    return;
  }

  // val format: "type||ID||PartName||Date||Amount||Qty"
  const parts = v.split('||');
  const type = parts[0], id = parts[1], partName = parts[2],
        date = parts[3], amount = parts[4], qty = parts[5] || '—';

  preview.style.display = 'block';
  preview.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <span style="font-weight:800;color:var(--fg);font-size:14px">${partName}</span>
      <span style="color:var(--accent);font-family:var(--mono);font-weight:700">${amount}</span>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text2)">
      <span>📅 ${date}</span>
      <span>📦 Qty: <strong style="color:var(--fg)">${qty}</strong></span>
      <span>${type === 'sale' ? '🛒 Sale' : '📦 Purchase'}</span>
    </div>
    <div style="font-size:10px;color:var(--text3);margin-top:4px;font-family:var(--mono)">${id}</div>
  `;

  btn.style.opacity = '1'; btn.style.pointerEvents = 'auto';
  window._reqSelectedRecord = { type, id, partName, date, amount, qty };
}

async function sendOtpRequest(userName) {
  const btn = document.getElementById('req-btn');
  if (btn) { btn.textContent = 'Sending...'; btn.disabled = true; }

  const rec = window._reqSelectedRecord;
  const detail = rec
    ? `wants to edit a ${rec.type} — ${rec.partName}, Qty ${rec.qty} (${rec.date}, ${rec.amount})`
    : 'is requesting edit access';

  try {
    await api('requestEditOtp', {
      requesterName: userName,
      recordDetail: detail,
      recordId:   rec ? rec.id   : '',
      recordType: rec ? rec.type : ''
    });
  } catch(e) {}

  const reqStep = document.getElementById('staff-req-step');
  const waitStep = document.getElementById('staff-wait-step');
  if (reqStep) reqStep.style.display = 'none';
  if (waitStep) waitStep.style.display = 'flex';

  // Show what they're waiting to edit
  const waitDetail = document.getElementById('staff-wait-detail');
  if (waitDetail && rec) {
    waitDetail.innerHTML = `Admin notified.<br><strong style="color:var(--accent)">${rec.partName}</strong> ${rec.type} · ${rec.date}<br>Enter the code below once admin sends it.`;
  } else if (waitDetail) {
    waitDetail.textContent = 'Admin has been notified. Enter the code below once they share it.';
  }

  window._otpInput = '';
  _otpUpdateDots();
  toast('Admin notified ✓', 'success');
}

  showModal(`

          `<button onclick="apKey('${k}')" style="

            background:var(--surface2);color:var(--fg);
            font-size:${k==='⌫'?'20':'22'}px;font-weight:700;cursor:pointer;font-family:var(--font)

        ).join('')}

    for (let i = 0; i < 4; i++) {
      const d = document.getElementById('ap-d'+i);
      if (d) { const f = i < window._apInput.length; d.style.background = f?'var(--accent)':'transparent'; d.style.borderColor = f?'var(--accent)':'var(--text3)'; }
    }
    document.getElementById('ap-error').textContent = '';
    if (window._apInput.length === 4) setTimeout(verifyAdminAndGenerateOtp, 120);
  };

async function verifyAdminAndGenerateOtp() {
  const errEl = document.getElementById('ap-error');
  if (errEl) errEl.textContent = 'Verifying...';
  try {
    const pinRes = await api('verifyPin', { pin: window._apInput });
    if (!pinRes.success) {
      if (errEl) errEl.textContent = 'Wrong PIN. Try again.';
      window._apInput = '';
      for (let i=0;i<4;i++){const d=document.getElementById('ap-d'+i);if(d){d.style.background='transparent';d.style.borderColor='var(--text3)';}}
      return;
    }
    const otpRes = await api('generateEditOtp', { recordId: '', recordType: '' });
    if (!otpRes.success) { toast('Failed to generate OTP','error'); return; }

    const targetUser = document.getElementById('otp-send-to')?.value || 'user1';
    const targetName = targetUser === 'user1'
      ? (state.settings.user1Name || 'User 1')
      : (state.settings.user2Name || 'User 2');

    await api('sendOtpNotification', {
      toUser: targetUser, otp: otpRes.otp,
      fromUser: state.currentUser || 'Admin',
      recordId: '', recordType: '', recordLabel: ''
    });
    await fetchNotifications();

    document.getElementById('otp-step-pin').style.display = 'none';
    document.getElementById('otp-step-enter').style.display = 'flex';
    const msg = document.getElementById('otp-sent-to-msg');
    if (msg) msg.innerHTML = `Code sent to <strong>${targetName}</strong>'s inbox.<br>They'll see it when they open their 🔔 inbox.`;
  } catch(e) {
    if (errEl) errEl.textContent = 'Connection error. Try again.';
    window._apInput = '';
  }
}

window.otpKey = function(k) {
  if (k === '⌫') { window._otpInput = window._otpInput.slice(0,-1); }
  else { if (window._otpInput.length >= 6) return; window._otpInput += k; }
  _otpUpdateDots();
  const e = document.getElementById('otp-error'); if(e) e.textContent='';
  if (window._otpInput.length === 6) setTimeout(checkEditOtp, 120);
};

function _otpUpdateDots() {
  for (let i=0;i<6;i++){
    const d=document.getElementById('otp-d'+i); if(!d)return;
    const f=i<(window._otpInput||'').length;
    d.style.background=f?'var(--accent)':'transparent';
    d.style.borderColor=f?'var(--accent)':'var(--text3)';
  }
}

async function checkEditOtp() {
  try {
    const recordId   = window._pendingRecordId   || '';
    const recordType = window._pendingRecordType || '';
    const res = await api('verifyEditOtp', { otp: window._otpInput, recordId, recordType });
    if (res.success) {
      closeModal();
      const boundId   = res.recordId   || recordId;
      const boundType = res.recordType || recordType;
      if (boundId && boundType) {
        // Open the specific record edit modal directly
        setTimeout(() => {
          if (boundType === 'sale') showEditSaleModal(boundId);
          else if (boundType === 'purchase') showEditPurchaseModal(boundId);
        }, 150);
        toast('Code accepted — opening record ✓', 'success');
      } else {
        state.txEditMode = true; updateTxEditToggleBtn(); renderTxTab();
        toast('Edit mode unlocked ✓', 'success');
      }
      window._pendingRecordId = '';
      window._pendingRecordType = '';
    } else {
      const e=document.getElementById('otp-error'); if(e) e.textContent=res.error||'Incorrect code.';
      window._otpInput=''; _otpUpdateDots();
    }
  } catch(e) {
    const el=document.getElementById('otp-error'); if(el) el.textContent='Connection error.';
    window._otpInput=''; _otpUpdateDots();
  }
}

function renderChecklist() {
  const q = (document.getElementById('tx-search')?.value || '').trim();
  if (q) { renderChecklistFiltered(q); return; }
  const items = state.checklist;
  if (items.length === 0) {
    document.getElementById('tx-content').innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div><p>Checklist is empty.</p></div>`;
    return;
  }
  const pending = items.filter(i => i.Status === 'Pending');
  const ordered = items.filter(i => i.Status === 'Ordered');
  const received = items.filter(i => i.Status === 'Received');

  const section = (title, list, status) => list.length === 0 ? '' : `
    <div class="section-label">${title}</div>
    ${list.map(i => `
      <div class="check-item">
        <div class="check-box ${status === 'Ordered' ? 'ordered' : status === 'Received' ? 'checked' : ''}"
             onclick="cycleCheckStatus('${i.ItemID}', '${i.Status}')">
          ${status === 'Received' ? '✓' : status === 'Ordered' ? '⟳' : ''}
        </div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:700">${i.PartName}</div>
          <div style="font-size:12px;color:var(--text2)">Target: ${i.TargetQty} · ${i.Priority}</div>
        </div>
        <button onclick="deleteChecklistItem('${i.ItemID}')" style="background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer">×</button>
      </div>`).join('')}`;

  document.getElementById('tx-content').innerHTML =
    section('Pending', pending, 'Pending') +
    section('Ordered', ordered, 'Ordered') +
    section('Received', received, 'Received');
}

async function cycleCheckStatus(itemId, current) {
  const next = current === 'Pending' ? 'Ordered' : current === 'Ordered' ? 'Received' : 'Pending';
  await api('updateChecklistStatus', { ItemID: itemId, Status: next });
  await loadAll(); renderChecklist();
}

async function deleteChecklistItem(itemId) {
  await api('deleteChecklistItem', { ItemID: itemId });
  await loadAll(); renderChecklist();
}

}

function _closeSaleDropdownOutside(e) {
  const wrap = document.getElementById('sl-part-wrap');
  if (wrap && !wrap.contains(e.target)) {
    const dd = document.getElementById('sl-dropdown');
    if (dd) dd.style.display = 'none';
  }
}

function showSaleDropdown() {
  filterSaleParts();
  const dd = document.getElementById('sl-dropdown');
  if (dd) dd.style.display = 'block';
}

function filterSaleParts() {
  const q = (document.getElementById('sl-search')?.value || '').toLowerCase().trim();
  const dd = document.getElementById('sl-dropdown');
  if (!dd) return;
  const filtered = state.parts
    .filter(p => !q || (p.Name||'').toLowerCase().includes(q))
    .sort((a,b) => (a.Name||'').localeCompare(b.Name||''))
    .slice(0, 60);
  if (filtered.length === 0) {
    dd.innerHTML = `<div style="padding:14px;text-align:center;color:var(--text3);font-size:13px">No parts found</div>`;
    dd.style.display = 'block';
    return;
  }
  dd.innerHTML = filtered.map(p => {
    const qty      = parseInt(p.StockQty) || 0;
    const reorder  = parseInt(p.ReorderLevel) || 5;
    const outOfStock = qty <= 0;
    const lowStock   = !outOfStock && qty <= reorder;
    const stockColor = outOfStock ? 'var(--red)' : lowStock ? '#f59e0b' : 'var(--green)';
    const stockLabel = outOfStock ? '✗ Out of stock' : `${qty} in stock`;
    return `<div onclick="selectSalePart('${p.PartID}','${(p.Name||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}','${p.SellingPrice}','${qty}')"
      style="padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);
        display:flex;justify-content:space-between;align-items:center;transition:background .1s;
        ${outOfStock ? 'opacity:.45;pointer-events:none' : ''}"
      onmouseenter="this.style.background='var(--surface2)'"
      onmouseleave="this.style.background='transparent'">
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--fg)">${p.Name}</div>
        <div style="font-size:11px;color:${stockColor};margin-top:2px">${stockLabel}</div>
      </div>
      <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;margin-left:8px">
        ${fmtMoney(p.SellingPrice)}
      </div>
    </div>`;
  }).join('');
  dd.style.display = 'block';
}

function selectSalePart(partId, partName, sellingPrice, stockQty) {
  document.getElementById('sl-part').value = `${partId}||${partName}||${sellingPrice}`;
  document.getElementById('sl-search').value = '';
  document.getElementById('sl-dropdown').style.display = 'none';
  const badge = document.getElementById('sl-selected-badge');
  badge.style.display = 'flex';
  document.getElementById('sl-selected-name').textContent = partName;
  const qty = parseInt(stockQty);
  const stockColor = qty <= 0 ? 'var(--red)' : qty <= 5 ? '#f59e0b' : 'var(--green)';
  document.getElementById('sl-selected-stock').innerHTML =
    `Stock: <strong style="color:${stockColor}">${qty}</strong> units available`;
  const clearBtn = document.getElementById('sl-clear-btn');
  if (clearBtn) clearBtn.style.display = 'block';
  if (sellingPrice) {
    document.getElementById('sl-price').value = sellingPrice;
    calcSaleTotal();
  }
  setTimeout(() => document.getElementById('sl-qty')?.select(), 50);
}

function clearSalePart() {
  document.getElementById('sl-part').value = '';
  document.getElementById('sl-search').value = '';
  document.getElementById('sl-selected-badge').style.display = 'none';
  const clearBtn = document.getElementById('sl-clear-btn');
  if (clearBtn) clearBtn.style.display = 'none';
  document.getElementById('sl-search').focus();
  showSaleDropdown();
}

function calcSaleTotal() {
  const qty = parseInt(val('sl-qty')) || 0;
  const price = parseFloat(val('sl-price')) || 0;
  const el = document.getElementById('sl-total');
  if (el) el.textContent = 'Total: ' + fmtMoney(qty * price);
}

async function saveSale() {
  const btn = document.querySelector('#modal-container .btn-primary');
  if (!beginSubmit(btn, 'Saving...')) return;
  try {
    const partVal = val('sl-part').split('||');
    if (!partVal[0]) { endSubmit(btn, 'Save Sale'); toast('Please select a part first', 'error'); return; }
    const res = await api('saveSale', {
      Date: val('sl-date'), PartID: partVal[0], PartName: partVal[1],
      Qty: val('sl-qty'), SellingPrice: val('sl-price'), Notes: val('sl-notes')
    });
    if (res.success) {
      await loadAll(); closeModal(); renderDashboard();
      if (state.currentView === 'transactions') renderTxTab();
      toast('Sale recorded ✓', 'success');
    } else {
      toast(res.error || 'Save failed', 'error');
      endSubmit(btn, 'Save Sale');
    }
  } catch(e) {
    toast('Error saving sale', 'error');
    endSubmit(btn, 'Save Sale');
  }
}

  // Sort parts alphabetically for easy selection

  showModal(`

      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <label>Part *</label>
    <select id="pu-part" onchange="onPurchasePartChange()" style="font-size:14px">
      <option value="">-- Select Part --</option>
      ${sortedParts.map(p => `<option value="${p.PartID}||${p.Name}||${p.CostPrice}"
        ${p.PartID === presetPartId ? 'selected' : ''}>${p.Name}</option>`).join('')}
    </select>

    <!-- Cost price hint shown after part selected -->
    <div id="pu-price-hint" style="display:none;background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);
      border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px">
      <span style="color:var(--text2)">Saved cost price: </span>
      <span id="pu-saved-cost" style="font-family:var(--mono);font-weight:700;color:var(--accent)"></span>
      <span style="color:var(--text3)"> — auto-filled below</span>
    </div>

    <div class="form-row">
      <div>
        <label>Qty Received *</label>
        <input id="pu-qty" type="number" inputmode="numeric" placeholder="1" value="1"
          style="font-size:20px;font-weight:800;text-align:center"
          oninput="calcPurchaseTotal()" />
      </div>
      <div>
        <label>Cost/unit (UGX) *</label>
        <input id="pu-cost" type="number" inputmode="numeric" placeholder="0"
          style="font-size:18px;font-weight:700;font-family:var(--mono)"
          oninput="calcPurchaseTotal()" />
      </div>
    </div>

    <div style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:14px;
      display:flex;justify-content:space-between;align-items:center">
      <span style="color:var(--text2);font-size:13px">Total Cost</span>
      <span id="pu-total" style="font-family:var(--mono);font-size:20px;font-weight:800;color:var(--accent)">UGX 0</span>
    </div>

    <label>Supplier <span style="font-weight:400;color:var(--text3)">(optional)</span></label>
    <select id="pu-sup" style="margin-bottom:10px">
      <option value="">-- No Supplier --</option>
      ${state.suppliers.map(s => `<option value="${s.SupplierID}||${s.Name}">${s.Name}</option>`).join('')}
    </select>

    <label>Date</label>
    <input id="pu-date" value="${todayStr()}" style="margin-bottom:10px" />

    <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="pu-updatecost" style="width:auto;margin:0" />
      <span style="font-size:13px">Update saved cost price to this amount</span>
    </label>

    <label>Notes</label>
    <input id="pu-notes" placeholder="Optional" />
    <button class="btn btn-primary" onclick="savePurchase()" style="margin-top:12px">✓ Add to Stock</button>
  `);

  // If preset part, auto-fill cost
  if (presetPartId) {
    setTimeout(() => {
      document.getElementById('pu-part').value = '';
      // Find and select the part
      const opts = document.getElementById('pu-part').options;
      for (let i = 0; i < opts.length; i++) {
        if (opts[i].value.startsWith(presetPartId + '||')) {
          opts[i].selected = true;
          break;
        }
      }
      onPurchasePartChange();
    }, 50);
  }
}

function onPurchasePartChange() {
  const partVal = val('pu-part').split('||');
  const partId = partVal[0];
  const savedCost = parseFloat(partVal[2]) || 0;

  if (partId && savedCost > 0) {
    // Auto-fill cost price from saved data
    document.getElementById('pu-cost').value = savedCost;
    document.getElementById('pu-price-hint').style.display = 'block';
    document.getElementById('pu-saved-cost').textContent = fmtMoney(savedCost);
    calcPurchaseTotal();
  } else if (partId) {
    // Part found but no saved cost — try supplier rate
    const supVal = val('pu-sup').split('||');
    if (supVal[0]) {
      const rate = state.supplierRates.find(r => r.PartID === partId && r.SupplierID === supVal[0]);
      if (rate) {
        document.getElementById('pu-cost').value = rate.UnitPrice;
        calcPurchaseTotal();
      }
    }
    document.getElementById('pu-price-hint').style.display = 'none';
  } else {
    document.getElementById('pu-price-hint').style.display = 'none';
  }
}

function fillPurchaseRate() {
  onPurchasePartChange();
}

function calcPurchaseTotal() {
  const qty = parseInt(val('pu-qty')) || 0;
  const cost = parseFloat(val('pu-cost')) || 0;
  const el = document.getElementById('pu-total');
  if (el) el.textContent = fmtMoney(qty * cost);
}

async function savePurchase() {
  const btn = document.querySelector('#modal-container .btn-primary');

    const res = await api('savePurchase', {
      Date: val('pu-date'), PartID: partVal[0], PartName: partVal[1],

      Qty: val('pu-qty'), CostPrice: costPrice,

    if (res.success) {
      await autoSyncRateFromPart(partVal[0], partVal[1], supplierName, costPrice);
      await loadAll(); closeModal();
      if (state.currentView === 'transactions') renderTxTab();
      renderDashboard();
      toast('Purchase recorded ✓', 'success');
    } else {
      toast(res.error || 'Save failed', 'error');
      endSubmit(btn, '✓ Add to Stock');
    }
  } catch(e) {
    toast('Error saving purchase', 'error');
    endSubmit(btn, '✓ Add to Stock');
  }

function renderReports() {
  const sales = state.sales;
  const purchases = state.purchases;
  const parts = state.parts;

  const totalRev = sales.reduce((s, x) => s + (parseFloat(x.TotalAmount) || 0), 0);
  const totalCost = purchases.reduce((s, x) => s + (parseFloat(x.TotalCost) || 0), 0);
  const totalStockVal = parts.reduce((s, p) => s + ((parseFloat(p.CostPrice) || 0) * (parseInt(p.StockQty) || 0)), 0);

  // Sales by category
  const catSales = {};
  sales.forEach(s => {
    const part = parts.find(p => p.PartID === s.PartID);
    const cat = part?.Category || 'Other';
    catSales[cat] = (catSales[cat] || 0) + (parseFloat(s.TotalAmount) || 0);
  });

  // Top selling parts
  const partSales = {};
  sales.forEach(s => {
    partSales[s.PartName] = (partSales[s.PartName] || 0) + (parseInt(s.Qty) || 0);
  });
  const topParts = Object.entries(partSales).sort((a, b) => b[1] - a[1]).slice(0, 5);

  let html = `
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Financial Summary</div>
      <div class="profit-row"><span>Total Revenue</span><span class="profit-val" style="color:var(--green)">${fmtMoney(totalRev)}</span></div>
      <div class="profit-row"><span>Total Purchases</span><span class="profit-val" style="color:var(--red)">${fmtMoney(totalCost)}</span></div>
      <div class="profit-row"><span style="font-weight:700">Gross Profit</span><span class="profit-val" style="color:var(--accent);font-weight:700">${fmtMoney(totalRev - totalCost)}</span></div>
      <div class="profit-row"><span>Stock Value</span><span class="profit-val">${fmtMoney(totalStockVal)}</span></div>
    </div>`;

  if (topParts.length > 0) {
    html += `<div class="card">
      <div class="card-title" style="margin-bottom:12px">Top Selling Parts</div>
      ${topParts.map(([name, qty], i) => `
        <div class="profit-row">
          <span>${i + 1}. ${name}</span>
          <span class="profit-val">${qty} units</span>
        </div>`).join('')}
    </div>`;
  }

  if (Object.keys(catSales).length > 0) {
    html += `<div class="card">
      <div class="card-title" style="margin-bottom:12px">Sales by Category</div>
      ${Object.entries(catSales).sort((a, b) => b[1] - a[1]).map(([cat, amt]) => `
        <div class="profit-row">
          <span>${cat}</span>
          <span class="profit-val" style="color:var(--accent)">${fmtMoney(amt)}</span>
        </div>`).join('')}
    </div>`;
  }

  document.getElementById('reports-content').innerHTML = html;
}

    if (res.success) {

function updateNotifBadge() {
  const btn = document.getElementById('notif-btn');

function _timeAgo(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:220px">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k==='' ? `<div></div>` :
          `<button onclick="ap2Key('${k}')" style="height:52px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:${k==='⌫'?'18':'20'}px;font-weight:700;cursor:pointer;font-family:var(--font)">${k}</button>`
        ).join('')}
      </div>
      <div id="ap2-error" style="color:var(--red);font-size:13px;min-height:18px;text-align:center"></div>
    </div>
    <div id="otp-sent-confirm" style="display:none;flex-direction:column;align-items:center;gap:14px;padding:8px 0">
      <div style="font-size:40px">✅</div>
      <div style="font-size:14px;font-weight:700;color:var(--fg)">Code Sent!</div>
      <div id="otp-sent-msg" style="font-size:13px;color:var(--text2);text-align:center;line-height:1.7"></div>
      <button class="btn btn-ghost" style="width:100%" onclick="closeModal()">Done</button>
    </div>
  `);

  window._ap2Input = '';
  window._requestNotifId = requestNotifId;
  window._requestRecordId   = recordId   || '';
  window._requestRecordType = recordType || '';

  // Pre-select the requesting user if name matches
  const sel = document.getElementById('otp-target-user');
  if (sel && forUserName) {
    const u1 = state.settings.user1Name || 'User 1';
    const u2 = state.settings.user2Name || 'User 2';
    if (forUserName === u1) sel.value = 'user1';
    else if (forUserName === u2) sel.value = 'user2';
  }

  window.ap2Key = async function(k) {
    if (k === '⌫') { window._ap2Input = window._ap2Input.slice(0,-1); }
    else { if (window._ap2Input.length >= 4) return; window._ap2Input += k; }
    for (let i=0;i<4;i++){
      const d=document.getElementById('ap2-d'+i);
      if(d){const f=i<window._ap2Input.length;d.style.background=f?'var(--accent)':'transparent';d.style.borderColor=f?'var(--accent)':'var(--text3)';}
    }
    document.getElementById('ap2-error').textContent='';
    if (window._ap2Input.length === 4) setTimeout(verifyAndSendOtp, 120);
  };
}

async function verifyAndSendOtp() {
  const errEl = document.getElementById('ap2-error');
  if (errEl) errEl.textContent = 'Verifying...';
  try {
    const pinRes = await api('verifyPin', { pin: window._ap2Input });
    if (!pinRes.success) {
      if (errEl) errEl.textContent = 'Wrong PIN. Try again.';
      window._ap2Input = '';
      for(let i=0;i<4;i++){const d=document.getElementById('ap2-d'+i);if(d){d.style.background='transparent';d.style.borderColor='var(--text3)';}}
      return;
    }
    // Generate OTP bound to the specific record
    const recId   = window._requestRecordId   || '';
    const recType = window._requestRecordType || '';
    const otpRes = await api('generateEditOtp', { recordId: recId, recordType: recType });
    if (!otpRes.success) { if(errEl) errEl.textContent='Failed to generate OTP.'; return; }

    const targetUser = document.getElementById('otp-target-user')?.value || 'user1';
    const targetName = targetUser === 'user1'
      ? (state.settings.user1Name || 'User 1')
      : (state.settings.user2Name || 'User 2');

    const recLabel = recId ? `${recType} record (${recId})` : '';

    // Send to user inbox with record binding
    await api('sendOtpNotification', {
      toUser: targetUser, otp: otpRes.otp,
      fromUser: state.currentUser || 'Admin',
      recordId: recId, recordType: recType, recordLabel: recLabel
    });

    // Mark the request notification as read
    if (window._requestNotifId) {
      await api('markNotificationRead', { notifId: window._requestNotifId });
    }

    await fetchNotifications();

    // Show confirmation
    document.getElementById('otp-step-pin2').style.display = 'none';
    const conf = document.getElementById('otp-sent-confirm');
    conf.style.display = 'flex';
    document.getElementById('otp-sent-msg').innerHTML =
      `Code sent to <strong>${targetName}</strong>'s inbox.<br>They can open their inbox to use it.`;

  } catch(e) {
    if(errEl) errEl.textContent = 'Connection error. Try again.';
    window._ap2Input = '';
  }
}

// Save own PIN only (all users)
async function saveSettingsForm() {
  const role = state.currentRole;
  const pin = val('cfg-pin');
  const data = {};

  if (role === 'admin') {
    data.shopName  = val('cfg-shop');
    data.ownerName = val('cfg-owner');
    data.phone     = val('cfg-phone');
    if (pin) data.pin = pin;
  } else if (role === 'user1') {
    if (pin) data.user1Pin = pin;
  } else if (role === 'user2') {
    if (pin) data.user2Pin = pin;
  }

  if (Object.keys(data).length === 0) { toast('Nothing to save', 'error'); return; }
  const res = await api('saveSettings', data);
  if (res.success) {
    await loadAll(); closeModal();
    toast('PIN updated ✓', 'success');
  }
}

// Admin saves all settings including user names + PINs
async function saveAllSettings() {
  const data = {
    shopName:   val('cfg-shop'),
    ownerName:  val('cfg-owner'),
    phone:      val('cfg-phone'),
    adminEmail: val('cfg-email'),
    user1Name:  val('cfg-u1name'),

  };
  const adminPin = val('cfg-pin');
  const u1pin    = val('cfg-u1pin');
  const u2pin    = val('cfg-u2pin');
  if (adminPin) data.pin      = adminPin;
  if (u1pin)    data.user1Pin = u1pin;
  if (u2pin)    data.user2Pin = u2pin;

  const btn = document.querySelector('#modal-body .btn-primary');
  if (btn) { btn.textContent = 'Saving...'; btn.disabled = true; }

  const res = await api('saveSettings', data);
  if (res.success) {
    await loadAll();
    refreshLoginUserNames();
    closeModal();
    toast('Settings saved ✓', 'success');
  } else {
    toast('Save failed', 'error');
    if (btn) { btn.textContent = '💾 Save All'; btn.disabled = false; }
  }
}

function val(id) { return (document.getElementById(id)?.value || '').trim(); }

function fmtMoney(n) {
  const num = parseFloat(n) || 0;
  return 'UGX ' + num.toLocaleString('en-UG', { maximumFractionDigits: 0 });
}

function formatDisplayDate(d) {
  if (!d) return '—';
  const s = String(d);
  // Already in DD-Mon-YYYY format
  if (/\d{2}-[A-Z][a-z]{2}-\d{4}/.test(s)) return s;
  // ISO format: 2026-05-14T... → 14-May-2026
  try {
    const dt = new Date(s);
    if (!isNaN(dt)) {
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return String(dt.getDate()).padStart(2,'0') + '-' + months[dt.getMonth()] + '-' + dt.getFullYear();
    }
  } catch(e) {}
  return s;
}

function todayStr() {
  const now = new Date();
  const d = now.getDate().toString().padStart(2, '0');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d}-${months[now.getMonth()]}-${now.getFullYear()}`;
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.classList.remove('show'), 2500);
}

// Register Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(r => {
        console.log('SW registered, scope:', r.scope);
        r.update();

        // When a new SW is found, notify it to skip waiting
        r.addEventListener('updatefound', () => {
          const newWorker = r.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New SW installed — reload to get fresh code immediately
              console.log('[SW] New version available — reloading');
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      })
      .catch(e => console.log('SW failed:', e));

    // When SW takes control, reload the page to use new cache
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        console.log('[SW] Controller changed — reloading for fresh version');
        window.location.reload();
      }
    });
  });
}

    const catMatch = stockFilter === 'All' || p.Category === stockFilter;

      [p.ItemName||'', p.Name||'', p.Brand||'', p.PartNo||'', p.Size||'', p.Category||''].join(' '),
      stockQ
    );

function fmtShort(n) {
  const v = parseFloat(n)||0;

  const today = todayStr();
  const totalCostVal = filtered.reduce((s,p)=>s+((parseFloat(p.CostPrice)||0)*(parseInt(p.StockQty)||0)),0);

  const rows = [
    ['OOLA SPARES - STOCK LIST'],

async function runImport() {
  const parsed = window._importData;
  if (!parsed?.length) return;

  const existing = new Set(state.parts.map(p => p.Name.toLowerCase().trim()));
  const toImport = parsed.filter(p => !existing.has(p.fullName.toLowerCase().trim()));
  const skipped = parsed.length - toImport.length;

  if (toImport.length === 0) {
    toast('All parts already exist — nothing imported', 'error');
    return;
  }

  const btn = document.querySelector('#import-actions button');
  if (btn) { btn.textContent = `Importing ${toImport.length} parts...`; btn.disabled = true; }

  let done = 0;
  let failed = 0;
  const today = todayStr();

  for (const p of toImport) {
    try {
      const res = await api('savePart', {
        PartID: '',
        Name: p.fullName,
        Category: p.cat,
        PartNo: p.brand,
        Description: p.size,
        CostPrice: p.cost,
        SellingPrice: p.sell,
        StockQty: p.qty,
        ReorderLevel: 5,
        Unit: 'Piece',
        Movement: p.move
      });
      if (res.success) done++;
      else failed++;
    } catch(e) { failed++; }

    // Update button progress
    if (btn) btn.textContent = `Importing... ${done}/${toImport.length}`;
  }

  await loadAll();
  closeModal();
  renderParts();
  renderDashboard();

  let msg = `✓ Imported ${done} parts`;
  if (skipped > 0) msg += `, ${skipped} skipped (duplicates)`;
  if (failed > 0) msg += `, ${failed} failed`;
  toast(msg, 'success');
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsText(file);
  });
}

function parseCSV(text) {
  // Handle both comma and semicolon delimiters
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const delimiter = lines[0].includes(';') ? ';' : ',';
  return lines.map(line => {
    const cols = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === delimiter && !inQuotes) { cols.push(current.trim()); current = ''; }
      else { current += ch; }
    }
    cols.push(current.trim());
    return cols;
  });
}

// Auto-assign category based on item name
function guessCat(name) {
  const n = name.toLowerCase();
  if (/spark plug|bulb|switch|horn|wire system|cdi|ignition|coil|indicator|tail light|head lamp|dimmer|plug cap|dashboard|dush board/.test(n)) return 'Electrical';
  if (/clutch plate|sprocket|chain|gear|kick starter|clutch wire|clutch lever|clutch disk|clutch bearing/.test(n)) return 'Transmission';
  if (/brake/.test(n)) return 'Brakes';
  if (/tube|tyre|wheel axle|hub|rim/.test(n)) return 'Tyres & Tubes';
  if (/gasket|gasket maker|valve seal/.test(n)) return 'Gaskets';
  if (/bearing|oil seal/.test(n)) return 'Bearings & Seals';
  if (/shock absorber|seal shock|pipe shock/.test(n)) return 'Suspension';
  if (/air clear|oil filter|engine oil/.test(n)) return 'Filters';
  if (/raise wire|raise cable|raise handle|choke cable|carb/.test(n)) return 'Fuel System';
  if (/piston|valve|cylinder|crank|timing|oil pump|rocker|tappet|fly wheel|tensioner|engine/.test(n)) return 'Engine';
  if (/mud guard|chain guard|leg guard|side cover|handle bar|mirror|front sprocket cover/.test(n)) return 'Body/Panel';
  if (/stand|centre bolt|rubber boot/.test(n)) return 'Other';
  return 'Other';
}

// Auto-assign movement based on item name
function guessMove(name) {
  const n = name.toLowerCase();
  if (/spark plug|tube|tyre|brake cable|clutch wire|raise wire|dimmer|bulb|plug cap|chain$|front sprocket|rear sprocket|clutch plate|brake pad|indicator bulb|engine oil/.test(n)) return 'Fast';
  if (/mirror|gear lever|kick starter$|clutch lever|brake lever|shock absorber|chain adjuster|paper gasket|steel gasket|gasket maker|horn|neck bearing|oil seal|raise cable|raise handle|brake rod|side cover lock|indicator$|tail light$|switch|wire system|sprocket set|clutch disk|air clear|single stand spring|double stand spring|centre bolt|bulb holder/.test(n)) return 'Medium';
  return 'Slow';
}

// Clean qty string: "10pcs" → 10, "Box-10pcs" → 10, "2pairs" → 2
function cleanQty(val) {
  if (!val) return 0;
  const s = String(val).toLowerCase().replace(/box-/,'');
  const m = s.match(/(\d+)/);
  return m ? parseInt(m[1]) : 0;
}

async function previewImport(input) {
  const file = input.files[0];
  if (!file) return;
  const text = await file.text();
  const rows = parseCSV(text).filter(r => r.some(c => String(c).trim()));
  if (rows.length < 2) { toast('File empty or invalid', 'error'); return; }

  const headers = rows[0].map(h => String(h).trim().toLowerCase());

  // Find column indices flexibly
  const findCol = (...names) => {
    for (const n of names) {
      const i = headers.findIndex(h => h.replace(/[^a-z]/g,'').includes(n.replace(/[^a-z]/g,'')));
      if (i >= 0) return i;
    }
    return -1;
  };

  const iName     = findCol('name','item','part');
  const iPartNo   = findCol('partno','partno/type','type','size','spec');
  const iCat      = findCol('category','cat');
  const iCost     = findCol('costprice','cost');
  const iSell     = findCol('sellingprice','sell','price');
  const iQty      = findCol('stockqty','qty','quantity','stock');
  const iReorder  = findCol('reorderlevel','reorder');
  const iUnit     = findCol('unit');
  const iMove     = findCol('movement','speed','move');

  if (iName < 0) { toast('No Name column found', 'error'); return; }

  importData = [];
  const existing = new Set(state.parts.map(p => p.Name.toLowerCase().trim()));

  rows.slice(1).forEach(r => {
    const rawName = String(r[iName] || '').trim();
    if (!rawName) return;

    const partNo  = iPartNo >= 0 ? String(r[iPartNo] || '').trim() : '';
    // Build full name: "Spark Plug D8 Short" or "Tube 2.75-17"
    const fullName = partNo ? rawName + ' ' + partNo : rawName;

    const cat   = (iCat >= 0 && r[iCat]) ? String(r[iCat]).trim() : guessCat(rawName);
    const move  = (iMove >= 0 && r[iMove]) ? String(r[iMove]).trim() : guessMove(rawName);
    const cost  = parseFloat(r[iCost]) || 0;
    const sell  = parseFloat(r[iSell]) || 0;
    const qty   = iQty >= 0 ? cleanQty(r[iQty]) : 0;
    const reorder = iReorder >= 0 ? parseInt(r[iReorder]) || 5 : 5;
    const unit  = (iUnit >= 0 && r[iUnit]) ? String(r[iUnit]).trim() : 'Piece';

    importData.push({
      Name: fullName,
      Category: cat,
      PartNo: partNo,
      CostPrice: cost,
      SellingPrice: sell,
      StockQty: qty,
      ReorderLevel: reorder,
      Unit: unit,
      Movement: move,
      _isDup: existing.has(fullName.toLowerCase().trim())
    });
  });

  if (importData.length === 0) { toast('No valid rows found', 'error'); return; }

  const newItems = importData.filter(r => !r._isDup);
  const dupItems = importData.filter(r => r._isDup);
  const moveIcons = {Fast:'🔥',Medium:'⚡',Slow:'🐢',Dead:'❄️'};

  document.getElementById('import-stats').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
      <div class="stat-card" style="padding:10px">
        <div class="stat-label">Total Rows</div>
        <div class="stat-value green" style="font-size:20px">${importData.length}</div>
      </div>
      <div class="stat-card" style="padding:10px">
        <div class="stat-label">New Items</div>
        <div class="stat-value accent" style="font-size:20px">${newItems.length}</div>
      </div>
      <div class="stat-card" style="padding:10px">
        <div class="stat-label">Duplicates</div>
        <div class="stat-value" style="font-size:20px;color:var(--text2)">${dupItems.length}</div>
      </div>
    </div>
    ${dupItems.length > 0 ? `<div style="font-size:12px;color:var(--text3);margin-bottom:6px">⚠ Duplicates will be skipped</div>` : ''}`;

  document.getElementById('import-table').innerHTML = `
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <tr style="background:var(--surface2);position:sticky;top:0">
        <th style="padding:6px;text-align:left;border-bottom:1px solid var(--border)">Name</th>
        <th style="padding:6px;text-align:left;border-bottom:1px solid var(--border)">Cat</th>
        <th style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">Cost</th>
        <th style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">Sell</th>
        <th style="padding:6px;text-align:center;border-bottom:1px solid var(--border)">Qty</th>
        <th style="padding:6px;text-align:center;border-bottom:1px solid var(--border)">🏃</th>
      </tr>
      ${importData.map((r,i) => `
        <tr style="background:${r._isDup?'rgba(239,68,68,.05)':i%2===0?'var(--surface)':'var(--surface2)'}">
          <td style="padding:5px 6px;border-bottom:1px solid var(--border);${r._isDup?'color:var(--text3);text-decoration:line-through':''}">${r.Name}</td>
          <td style="padding:5px 6px;border-bottom:1px solid var(--border);color:var(--text3);font-size:10px">${r.Category}</td>
          <td style="padding:5px 6px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--mono)">${r.CostPrice?r.CostPrice.toLocaleString():'-'}</td>
          <td style="padding:5px 6px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--mono);color:var(--accent)">${r.SellingPrice?r.SellingPrice.toLocaleString():'-'}</td>
          <td style="padding:5px 6px;border-bottom:1px solid var(--border);text-align:center">${r.StockQty||'-'}</td>
          <td style="padding:5px 6px;border-bottom:1px solid var(--border);text-align:center">${moveIcons[r.Movement]||'⚡'}</td>
        </tr>`).join('')}
    </table>`;

  document.getElementById('import-preview').style.display = 'block';
  document.getElementById('import-confirm-btn').textContent = `✓ Import ${newItems.length} New Parts`;
}

async function confirmImport() {
  const clearFirst = document.getElementById('import-clear-first')?.checked;
  const toImport = clearFirst ? importData : importData.filter(r => !r._isDup);

  if (toImport.length === 0) { toast('Nothing to import', 'error'); return; }

  const btn = document.getElementById('import-confirm-btn');
  btn.disabled = true;

  // Clear existing parts first if selected
  if (clearFirst) {
    btn.textContent = 'Clearing old data...';
    const clearRes = await api('clearParts');
    if (!clearRes.success) { toast('Clear failed: ' + clearRes.error, 'error'); btn.disabled = false; return; }
    toast('Old data cleared ✓', 'success');
    // Also clear local state
    state.parts = [];
  }

  let done = 0, failed = 0;
  for (const part of toImport) {
    const { _isDup, ...data } = part;
    const res = await api('savePart', { ...data, PartID: '' });
    if (res.success) done++; else failed++;
    btn.textContent = `Importing... ${done}/${toImport.length}`;
  }

  await loadAll();
  closeModal();
  renderParts();
  renderDashboard();
  toast(`✓ Imported ${done} parts${failed?' · '+failed+' failed':''}`, 'success');
}

// ── CSV PARSER ──
function parseCSV(text) {
  const lines = text.replace(/\r/g,'').split('\n').filter(l => l.trim());
  return lines.map(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim());
    return cols;
  });
}

// ── HIGHLIGHT MATCHING TEXT ──
function highlight(text, query) {
  if (!query || !text) return text || '';
  const q = query.trim();
  if (!q) return text;
  try {
    const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return String(text).replace(
      new RegExp('(' + escaped + ')', 'gi'),
      '<mark style="background:rgba(240,165,0,.3);color:var(--accent);border-radius:3px;padding:0 2px">$1</mark>'
    );
  } catch(e) { return text; }
}
