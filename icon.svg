<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0a500"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  
  <!-- Outer gear ring -->
  <g transform="translate(96,96)">
    <!-- Gear teeth -->
    <g fill="#f0a500" opacity="0.9">
      <rect x="-8" y="-78" width="16" height="18" rx="3"/>
      <rect x="-8" y="60" width="16" height="18" rx="3"/>
      <rect x="60" y="-8" width="18" height="16" rx="3"/>
      <rect x="-78" y="-8" width="18" height="16" rx="3"/>
      <g transform="rotate(45)">
        <rect x="-8" y="-78" width="16" height="18" rx="3"/>
        <rect x="-8" y="60" width="16" height="18" rx="3"/>
        <rect x="60" y="-8" width="18" height="16" rx="3"/>
        <rect x="-78" y="-8" width="18" height="16" rx="3"/>
      </g>
    </g>
    <!-- Gear body circle -->
    <circle r="58" fill="#f0a500" opacity="0.15" stroke="#f0a500" stroke-width="2"/>
    <circle r="50" fill="#1a1a2e"/>
    <!-- Inner ring -->
    <circle r="22" fill="none" stroke="#f0a500" stroke-width="3" opacity="0.5"/>
    <circle r="10" fill="#f0a500" opacity="0.3"/>
  </g>

  <!-- Wrench -->
  <g transform="translate(96,96) rotate(-35)" filter="url(#glow)">
    <!-- Wrench handle -->
    <rect x="-7" y="-12" width="14" height="56" rx="5" fill="url(#accent)"/>
    <!-- Wrench head top -->
    <circle cx="0" cy="-18" r="16" fill="url(#accent)"/>
    <circle cx="0" cy="-18" r="8" fill="#1a1a2e"/>
    <circle cx="0" cy="-18" r="4" fill="url(#accent)" opacity="0.5"/>
    <!-- Wrench opening -->
    <rect x="-16" y="-26" width="10" height="16" rx="2" fill="#1a1a2e"/>
    <rect x="6" y="-26" width="10" height="16" rx="2" fill="#1a1a2e"/>
  </g>

  <!-- Spark/lightning bolt accent -->
  <g transform="translate(130,62)" opacity="0.8">
    <polygon points="0,-12 -5,0 2,0 -8,14 8,0 0,0 8,-12" fill="#ff6b35"/>
  </g>

  <!-- Bottom text dots -->
  <circle cx="76" cy="162" r="3" fill="#f0a500" opacity="0.6"/>
  <circle cx="96" cy="162" r="3" fill="#f0a500" opacity="0.9"/>
  <circle cx="116" cy="162" r="3" fill="#f0a500" opacity="0.6"/>
</svg>